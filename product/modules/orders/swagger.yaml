                type: number
        status:
          type: string
          enum: [reserving, reserved, paying, paid, canceled, expired, shipped, delivered, refunded]
        totalPrice:
          type: number
        discountCode:
          type: string
        discountAmount:
          type: number
        payablePrice:
          type: number
        paymentMethod:
          type: string

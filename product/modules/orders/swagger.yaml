openapi: 3.0.0
info:
  title: Orders API
  version: 1.0.0
  description: API documentation for Orders endpoints

tags:
  - name: Orders
    description: عملیات مربوط به سفارش محصول
  - name: Discounts
    description: مدیریت کدهای تخفیف سفارش

servers:
  - url: http://localhost:7033/api
    description: Local server
  - url: http://87.248.138.74:8080/api/v1
    description: Test server

security:
  - bearerAuth: []

paths:
  /orders:
    post:
      tags:
        - Orders
      summary: ایجاد سفارش جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
            examples:
              sample:
                summary: نمونه ایجاد سفارش با SKU
                value:
                  items:
                    - sku: "SKU-ABC-001"
                      quantity: 2
                    - sku: "SKU-XYZ-002"
                      quantity: 1
                  discountCode: "OFF10"
                  shippingAddress: "تهران، خیابان مثال ۱۲۳"
      responses:
        '201':
          description: سفارش با موفقیت ایجاد شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: داده‌های ورودی نامعتبر است
        '500':
          description: خطای داخلی سرور
    get:
      tags:
        - Orders
      summary: دریافت تمام سفارشات
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum: [reserving, reserved, paying, paid, canceled, expired, shipped, delivered, refunded]
      responses:
        '200':
          description: لیست سفارشات
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
              examples:
                sample:
                  value:
                    status: success
                    data:
                      - _id: "650000000000000000000001"
                        user: "u123"
                        status: reserved
                        totalPrice: 300000
                        payablePrice: 270000
                        discountCode: "OFF10"
                        discountAmount: 30000
                        items:
                          - product: "64f000000000000000000001"
                            variantId: "64f0000000000000000000a1"
                            quantity: 2
                            price: 100000
                    pagination:
                      page: 1
                      limit: 10
                      total: 1
                      pages: 1

  /orders/users/{userId}:
    get:
      tags:
        - Orders
      summary: دریافت سفارشات کاربر
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: لیست سفارشات کاربر
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
              examples:
                sample:
                  value:
                    status: success
                    data: []
                    pagination:
                      page: 1
                      limit: 10
                      total: 0
                      pages: 0

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: دریافت سفارش بر اساس شناسه
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش یافت شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
              examples:
                sample:
                  value:
                    status: success
                    data:
                      _id: "650000000000000000000001"
                      user: "u123"
                      status: reserved
                      totalPrice: 300000
                      payablePrice: 270000
                      items:
                        - product: "64f000000000000000000001"
                          variantId: "64f0000000000000000000a1"
                          quantity: 2
                          price: 100000
        '404':
          description: سفارش یافت نشد
    put:
      tags:
        - Orders
      summary: به‌روزرسانی سفارش
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderInput'
            examples:
              sample:
                value:
                  items:
                    - product: "64f000000000000000000001"
                      variantId: "64f0000000000000000000a1"
                      quantity: 3
                      price: 95000
                  shippingAddress: "تهران، خیابان نو"
      responses:
        '200':
          description: سفارش به‌روزرسانی شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: سفارش یافت نشد
    delete:
      tags:
        - Orders
      summary: حذف سفارش
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش حذف شد
        '404':
          description: سفارش یافت نشد

  /orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: به‌روزرسانی وضعیت سفارش
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [reserving, reserved, paying, paid, canceled, expired, shipped, delivered, refunded]
            examples:
              sample:
                value:
                  status: reserved
      responses:
        '200':
          description: وضعیت سفارش به‌روزرسانی شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'

  /orders/{id}/finalize-payment:
    post:
      tags:
        - Orders
      summary: نهایی کردن پرداخت سفارش
      description: این endpoint برای نهایی کردن پرداخت سفارش و کاهش موجودی محصولات استفاده می‌شود
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: شناسه سفارش
      responses:
        '200':
          description: پرداخت سفارش با موفقیت نهایی شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: پرداخت سفارش با موفقیت نهایی شد
        '400':
          description: سفارش در وضعیت رزرو نیست یا موجودی کافی نیست
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: سفارش در وضعیت رزرو نیست
        '404':
          description: سفارش یافت نشد
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: سفارش یافت نشد
        '500':
          description: خطای داخلی سرور

  /orders/{id}/cancel:
    post:
      tags:
        - Orders
      summary: لغو سفارش
      description: لغو سفارش رزرو شده و آزاد کردن موجودی رزرو شده
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: شناسه سفارش
      responses:
        '200':
          description: سفارش با موفقیت لغو شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: سفارش با موفقیت لغو شد
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: سفارش قابل لغو نیست
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: فقط سفارش‌های رزرو شده قابل لغو هستند
        '404':
          description: سفارش یافت نشد
        '500':
          description: خطای داخلی سرور

  /orders/inventory/stats:
    get:
      tags:
        - Orders
      summary: دریافت آمار موجودی
      description: دریافت آمار کلی موجودی محصولات
      responses:
        '200':
          description: آمار موجودی
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      totalProducts:
                        type: integer
                        description: تعداد کل محصولات فعال
                      lowStockProducts:
                        type: integer
                        description: تعداد محصولات با موجودی کم (کمتر از 5)
                      outOfStockProducts:
                        type: integer
                        description: تعداد محصولات بدون موجودی
                      reservedStock:
                        type: integer
                        description: تعداد کل موجودی رزرو شده
              examples:
                sample:
                  value:
                    status: success
                    data:
                      totalProducts: 120
                      lowStockProducts: 7
                      outOfStockProducts: 3
                      reservedStock: 42
        '500':
          description: خطای داخلی سرور

  /orders/stats:
    get:
      tags:
        - Orders
      summary: دریافت آمار سفارشات
      responses:
        '200':
          description: آمار سفارشات
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      totalRevenue:
                        type: number
                      reserving:
                        type: integer
                      reserved:
                        type: integer
                      paying:
                        type: integer
                      paid:
                        type: integer
                      expired:
                        type: integer
                      shipped:
                        type: integer
                      delivered:
                        type: integer
                      canceled:
                        type: integer
              examples:
                sample:
                  value:
                    status: success
                    data:
                      total: 10
                      totalRevenue: 1500000
                      reserving: 1
                      reserved: 2
                      paying: 0
                      paid: 5
                      expired: 1
                      shipped: 1
                      delivered: 0
                      canceled: 0

  /orders/discounts:
    post:
      tags:
        - Discounts
      summary: ایجاد کد تخفیف جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Discount'
            examples:
              sample:
                value:
                  code: "OFF10"
                  type: "percentage"
                  value: 10
                  expiry: "2025-12-31T23:59:59.000Z"
                  maxUsage: 1000
                  active: true
      responses:
        '201':
          description: تخفیف ایجاد شد
    get:
      tags:
        - Discounts
      summary: لیست کدهای تخفیف
      responses:
        '200':
          description: لیست تخفیف‌ها

  /orders/discounts/bulk:
    post:
      tags:
        - Discounts
      summary: ایجاد دسته‌ای کد تخفیف
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Discount'
            examples:
              sample:
                value:
                  - code: "OFF10"
                    type: "percentage"
                    value: 10
                    maxUsage: 100
                    active: true
                  - code: "FIX50K"
                    type: "fixed"
                    value: 50000
                    active: true
      responses:
        '201':
          description: تخفیف‌ها ایجاد شدند

  /orders/discounts/status/{code}:
    get:
      tags:
        - Discounts
      summary: وضعیت کد تخفیف با کد
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: وضعیت کد تخفیف
        '404':
          description: کد تخفیف پیدا نشد

  /orders/discounts/{id}:
    get:
      tags:
        - Discounts
      summary: دریافت تخفیف با شناسه
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: تخفیف یافت شد
        '404':
          description: یافت نشد
    patch:
      tags:
        - Discounts
      summary: ویرایش تخفیف
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Discount'
      responses:
        '200':
          description: تخفیف به‌روزرسانی شد
        '404':
          description: یافت نشد
    delete:
      tags:
        - Discounts
      summary: حذف تخفیف
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: حذف شد
        '404':
          description: یافت نشد

  /orders/discounts/apply:
    post:
      tags:
        - Discounts
      summary: اعمال کد تخفیف
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                userId:
                  type: string
                productIds:
                  type: array
                  items:
                    type: string
            examples:
              sample:
                value:
                  code: "OFF10"
                  userId: "u123"
                  productIds: ["64f000000000000000000001", "64f000000000000000000002"]
      responses:
        '200':
          description: تخفیف اعمال شد

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrderItem:
      type: object
      properties:
        product:
          type: string
        quantity:
          type: integer
        price:
          type: number
        variantId:
          type: string
    Order:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [reserving, reserved, paying, paid, canceled, expired, shipped, delivered, refunded]
        totalPrice:
          type: number
        discountCode:
          type: string
        discountAmount:
          type: number
        payablePrice:
          type: number
        paymentMethod:
          type: string
        shippingAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Discount:
      type: object
      properties:
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
        expiry:
          type: string
          format: date-time
        maxUsage:
          type: integer
        usedCount:
          type: integer
        active:
          type: boolean
        productIds:
          type: array
          items:
            type: string
        userIds:
          type: array
          items:
            type: string
    CreateOrderInput:
      type: object
      required:
        - items
        - shippingAddress
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - sku
              - quantity
            properties:
              sku:
                type: string
                description: شناسه یکتا SKU برای وریانت محصول
              quantity:
                type: integer
        # status تعیین شده توسط سرور است
        totalPrice:
          type: number
          description: توسط سرور محاسبه می‌شود
        discountCode:
          type: string
        discountAmount:
          type: number
        payablePrice:
          type: number
          description: توسط سرور محاسبه می‌شود
        paymentMethod:
          type: string
        shippingAddress:
          type: string
          description: آدرس تحویل (اجباری)
    UpdateOrderInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              product:
                type: string
              variantId:
                type: string
              quantity:
                type: integer
              price:
                type: number
        status:
          type: string
          enum: [reserving, reserved, paying, paid, canceled, expired, shipped, delivered, refunded]
        totalPrice:
          type: number
        discountCode:
          type: string
        discountAmount:
          type: number
        payablePrice:
          type: number
        paymentMethod:
          type: string
        shippingAddress:
          type: string
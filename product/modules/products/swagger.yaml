components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        old_price:
          type: number
          description: قیمت قدیمی محصول (اختیاری)
        category_id:
          type: string
        metadata:
          type: object
        status:
          type: string
          enum: [active, inactive, draft, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        image_ids:
          type: array
          items:
            type: string
          description: لیست آیدی عکس‌های محصول
        img:
          type: string
          description: آیدی عکس اصلی محصول
        sku:
          type: number
          description: کد یکتای محصول (فقط خواندنی)
          readOnly: true
    ProductInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        old_price:
          type: number
          description: قیمت قدیمی محصول (اختیاری)
        category_id:
          type: string
        metadata:
          type: object
        status:
          type: string
          enum: [active, inactive, draft, archived]
        attributes:
          type: array
          description: List of attribute values for this product, each with attribute_id and value.
          items:
            type: object
            properties:
              attribute_id:
                type: string
                description: The ID of the category attribute
              value:
                type: string
                description: The value for this attribute (string, number, or enum)
        image_ids:
          type: array
          items:
            type: string
          description: لیست آیدی عکس‌های محصول
        img:
          type: string
          description: آیدی عکس اصلی محصول
        sku:
          type: number
          description: کد یکتای محصول (توسط سیستم مقداردهی می‌شود، فقط خواندنی)
          readOnly: true
      example:
        name: "Sample Product"
        slug: "sample-product"
        price: 100
        category_id: "64f1c2..."
        attributes:
          - attribute_id: "64f1c2..."
            value: "Red"
          - attribute_id: "64f1c3..."

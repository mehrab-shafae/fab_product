      summary: Get all chats for a user
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
        - in: query
          name: userId
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: List of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductChat'
  /{productId}/analytics:
    get:
      tags:
        - Analytics
      summary: Get analytics for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: Product analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalytics'
    put:
      tags:
        - Analytics
      summary: Update analytics for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAnalyticsInput'
      responses:
        '200':
          description: Analytics updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalytics'
components:
  schemas:
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category_id:
          type: string
        metadata:
          type: object
        status:
          type: string
          enum: [active, inactive, draft, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
    ProductInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category_id:
          type: string
        metadata:
          type: object
        status:
          type: string
          enum: [active, inactive, draft, archived]
        attributes:
          type: array
          description: List of attribute values for this product, each with attribute_id and value.
          items:
            type: object
            properties:
              attribute_id:
                type: string
                description: The ID of the category attribute
              value:
                type: string
                description: The value for this attribute (string, number, or enum)
      example:
        name: "Sample Product"
        price: 100
        category_id: "64f1c2..."
        attributes:
          - attribute_id: "64f1c2..."
            value: "Red"
          - attribute_id: "64f1c3..."
            value: 42
    ProductAttribute:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        data_type:
          type: string
        options:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
    ProductAttributeInput:
      type: object
      required:
        - name
        - data_type
      properties:
        name:
          type: string
        data_type:
          type: string
        options:
          type: array
          items:
            type: string
    ProductAttributeValue:
      type: object
      properties:
        _id:
          type: string
        product_id:
          type: string
        attribute_id:
          type: string
        value:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    get:
      tags:
        - Review
      summary: Get all reviews for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductReview'
    delete:
      tags:
        - Review
      summary: Delete a review by ID
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
        - in: query
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      responses:
        '200':
          description: Review deleted
        '404':
          description: Review not found
  /{productId}/comments:
    post:
      tags:
        - Comment
      summary: Add a comment to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCommentInput'
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:

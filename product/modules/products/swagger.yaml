            type: string
        - in: query
          name: priceHistoryId
          required: true
          schema:
            type: string
          description: PriceHistory ID
      responses:
        '200':
          description: Price history deleted
        '404':
          description: Price history not found
    get:
      tags:
        - PriceHistory
      summary: Get price statistics for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: Price statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  min:
                    type: number
                  max:
                    type: number
                  avg:
                    type: number

openapi: 3.0.0
info:
  title: Product API
  version: 1.0.0
  description: API documentation for product CRUD and search endpoints

tags:
  - name: Product
    description: عملیات مربوط به محصول
  - name: Attribute
    description: ویژگی‌های محصول
  - name: Review
    description: نظرات کاربران روی محصول
  - name: Comment
    description: کامنت‌های کاربران روی محصول
  - name: Tag
    description: تگ‌های محصول
  - name: Image
    description: تصاویر محصول
  - name: Variant
    description: واریانت‌های محصول
  - name: Inventory
    description: موجودی محصول
  - name: PriceHistory
    description: تاریخچه قیمت محصول
  - name: Version
    description: نسخه‌های محصول
  - name: Relationship
    description: روابط بین محصولات
  - name: Wishlist
    description: لیست علاقه‌مندی‌های کاربر
  - name: Chat
    description: چت‌های مربوط به محصول
  - name: Analytics
    description: آنالیتیکس محصول

servers:
  - url: http://localhost:7021/api/product/v2
    description: Local server
paths:
  /:
    post:
      tags:
        - Product
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
    get:
      tags:
        - Product
      summary: Search products
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Product name to search
        - in: query
          name: category_id
          schema:
            type: string
          description: Category ID
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, draft, archived]
          description: Product status
        - in: query
          name: min_price
          schema:
            type: number
          description: Minimum price
        - in: query
          name: max_price
          schema:
            type: number
          description: Maximum price
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Page size
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /{id}:
    get:
      tags:
        - Product
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
    put:
      tags:
        - Product
      summary: Update product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
        '404':
          description: Product not found
    delete:
      tags:
        - Product
      summary: Delete product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found
  /attributes:
    post:
      tags:
        - Attribute
      summary: Create a new product attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAttributeInput'
      responses:
        '201':
          description: Product attribute created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttribute'
        '400':
          description: Invalid input
    get:
      tags:
        - Attribute
      summary: Get all product attributes
      responses:
        '200':
          description: List of product attributes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductAttribute'
  /{productId}/attributes:
    post:
      tags:
        - Attribute
      summary: Add attribute value to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAttributeValueInput'
      responses:
        '201':
          description: Attribute value added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributeValue'
        '400':
          description: Invalid input
    get:
      tags:
        - Attribute
      summary: Get all attribute values for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: List of attribute values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductAttributeValue'
  /{productId}/reviews:
    post:
      tags:
        - Review
      summary: Add a review to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true

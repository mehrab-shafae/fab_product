openapi: 3.0.0
info:
  title: Product API
  version: 1.0.0
  description: API documentation for product CRUD and search endpoints

tags:
  - name: Product
    description: عملیات مربوط به محصول
  - name: Attribute
    description: ویژگی‌های محصول
  - name: Review
    description: نظرات کاربران روی محصول
  - name: Comment
    description: کامنت‌های کاربران روی محصول
  - name: Tag
    description: تگ‌های محصول
  - name: Image
    description: تصاویر محصول
  - name: Variant
    description: واریانت‌های محصول
  - name: Inventory
    description: موجودی محصول
  - name: PriceHistory
    description: تاریخچه قیمت محصول
  - name: Version
    description: نسخه‌های محصول
  - name: Relationship
    description: روابط بین محصولات
  - name: Wishlist
    description: لیست علاقه‌مندی‌های کاربر
  - name: Chat
    description: چت‌های مربوط به محصول
  - name: Analytics
    description: آنالیتیکس محصول

servers:
  - url: http://localhost:7021/api/product/v2
    description: Local server
  - url: http://87.248.130.52:8080/api/v1/product
    description: Test server

security:
  - bearerAuth: []

paths:
  /:
    post:
      tags:
        - Product
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
    get:
      tags:
        - Product
      summary: Search products
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Product name to search
        - in: query
          name: category_id
          schema:
            type: string
          description: Category ID
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, draft, archived]
          description: Product status
        - in: query
          name: min_price
          schema:
            type: number
          description: Minimum price
        - in: query
          name: max_price
          schema:
            type: number
          description: Maximum price
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Page size
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /bulk:
    post:
      tags:
        - Product
      summary: Get multiple products by IDs
      description: دریافت همزمان چندین محصول بر اساس آرایه‌ای از شناسه‌ها. محصولات به ترتیب ورودی بازگردانده می‌شوند.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productIds
              properties:
                productIds:
                  type: array
                  items:
                    type: string
                  description: آرایه‌ای از شناسه‌های محصولات
                  example: ["64f1c2a3b4c5d6e7f8a9b0c1", "64f1c2a3b4c5d6e7f8a9b0c2"]
            example:
              productIds: ["64f1c2a3b4c5d6e7f8a9b0c1", "64f1c2a3b4c5d6e7f8a9b0c2"]
      responses:
        '200':
          description: List of products with attributes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        description:
                          type: string
                        price:
                          type: number
                        old_price:
                          type: number
                        category_id:
                          type: string
                        metadata:
                          type: object
                        status:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        deleted_at:
                          type: string
                          format: date-time
                        image_ids:
                          type: array
                          items:
                            type: string
                        img:
                          type: string
                        sku:
                          type: number
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              _id:
                                type: string
                              product_id:
                                type: string
                              attribute_id:
                                type: object
                                properties:
                                  _id:
                                    type: string
                                  name:
                                    type: string
                                  data_type:
                                    type: string
                              value:
                                type: string
                              created_at:
                                type: string
                                format: date-time
                              updated_at:
                                type: string
                                format: date-time
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "productIds must be an array"
  /slug/{slug}:
    get:
      tags:
        - Product
      summary: Get product by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: Product slug
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
  /{id}:
    get:
      tags:
        - Product
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
    put:
      tags:
        - Product
      summary: Update product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
        '404':
          description: Product not found
    delete:
      tags:
        - Product
      summary: Delete product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found
  /attributes:
    post:
      tags:
        - Attribute
      summary: Create a new product attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAttributeInput'
      responses:
        '201':
          description: Product attribute created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttribute'
        '400':
          description: Invalid input
    get:
      tags:
        - Attribute
      summary: Get all product attributes
      responses:
        '200':
          description: List of product attributes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductAttribute'
  /attributes/search:
    post:
      tags:
        - Attribute
      summary: Deep search products by attribute values
      description: جستجوی پیشرفته محصولات بر اساس attribute و مقدارهای آن‌ها. خروجی شامل اطلاعات کامل هر محصول و attribute/valueهای آن است.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: شماره صفحه (شروع از 1)
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: تعداد آیتم در هر صفحه
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      attribute:
                        type: string
                        description: نام attribute (مثلاً color)
                      values:
                        type: array
                        items:
                          type: string
                        description: آرایه‌ای از مقادیر attribute (مثلاً ["red", "blue"])
                slugs:
                  type: array
                  items:
                    type: string
                  description: لیست slugهای یکتای محصولاتی که باید جستجو شوند (اختیاری)
              example:
                filters:
                  - attribute: color
                    values: ["red", "blue"]
                  - attribute: size
                    values: ["XL"]
                slugs: ["product-slug-1", "product-slug-2"]
      responses:
        '200':
          description: لیست محصولات مطابق با فیلترها
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        product:
                          $ref: '#/components/schemas/Product'
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              attribute:
                                type: string
                              value:
                                type: string
                  count:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
        '400':
          description: Invalid input
  /attributes/search-only:
    post:
      tags:
        - Attribute
      summary: Search products by attributes only (without specific values)
      description: جستجوی محصولات بر اساس نام attributeها بدون در نظر گرفتن مقدار خاص. برای تست و بررسی مشکل refها استفاده می‌شود.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: شماره صفحه (شروع از 1)
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: تعداد آیتم در هر صفحه
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      attribute:
                        type: string
                        description: نام attribute (مثلاً color)
                      values:
                        type: array
                        items:
                          type: string
                        description: آرایه‌ای از مقادیر attribute (مثلاً ["red", "blue"]). اگر خالی باشد، فقط وجود attribute مهم است.
                slugs:
                  type: array
                  items:
                    type: string
                  description: لیست slugهای یکتای محصولاتی که باید جستجو شوند (اختیاری)
              example:
                filters:
                  - attribute: color
                    values: ["red", "blue"]
                  - attribute: size
                    values: []
                slugs: ["product-slug-1", "product-slug-2"]
      responses:
        '200':
          description: لیست محصولات که attributeهای مورد نظر را دارند
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        product:
                          $ref: '#/components/schemas/Product'
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              attribute:
                                type: string
                              value:
                                type: string
                  count:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
        '400':
          description: Invalid input
  /attributes/search-by-categories:
    post:
      tags:
        - Attribute
      summary: جستجوی ترکیبی محصولات بر اساس slug های دسته‌بندی و ویژگی‌ها
      description: ابتدا دسته‌بندی‌های مربوط به slug های ارسالی را پیدا کرده، سپس محصولات مربوط به آن دسته‌بندی‌ها (شامل تمام زیرمجموعه‌ها) را می‌آورد و در نهایت فیلترهای attribute و option را روی محصولات اعمال می‌کند.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: شماره صفحه (شروع از 1)
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: تعداد آیتم در هر صفحه
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categorySlugs
              properties:
                categorySlugs:
                  type: array
                  items:
                    type: string
                  description: آرایه‌ای از slug های دسته‌بندی‌ها (مثلاً ["electronics", "smartphones"])
                  example: ["electronics", "smartphones", "laptops"]
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      attribute:
                        type: string
                        description: نام attribute (مثلاً brand)
                      values:
                        type: array
                        items:
                          type: string
                        description: آرایه‌ای از مقادیر attribute (مثلاً ["Apple", "Samsung"])
                  description: فیلترهای attribute (اختیاری)
                  example:
                    - attribute: brand
                      values: ["Apple", "Samsung", "Sony"]
                    - attribute: color
                      values: ["black", "white", "blue"]
              example:
                categorySlugs: ["electronics", "smartphones", "laptops"]
                filters:
                  - attribute: brand
                    values: ["Apple", "Samsung", "Sony"]
                  - attribute: color
                    values: ["black", "white", "blue"]
      responses:
        '200':
          description: لیست محصولات مطابق با فیلترهای دسته‌بندی و ویژگی‌ها
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        product:
                          $ref: '#/components/schemas/Product'
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              attribute:
                                type: string
                              value:
                                type: string
                  count:
                    type: integer
                    description: تعداد محصولات در این صفحه
                  page:
                    type: integer
                    description: شماره صفحه فعلی
                  limit:
                    type: integer
                    description: تعداد آیتم در هر صفحه
                  total:
                    type: integer
                    description: تعداد کل محصولات مطابق با فیلترها
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                    description: اطلاعات دسته‌بندی‌های پیدا شده
                  totalCategories:
                    type: integer
                    description: تعداد کل دسته‌بندی‌ها (شامل زیرمجموعه‌ها)
                  message:
                    type: string
                    description: پیام اضافی (در صورت عدم یافتن دسته‌بندی)
        '400':
          description: Invalid input - categorySlugs must be provided as a non-empty array
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "categorySlugs must be provided as a non-empty array"
  /{productId}/attributes:
    post:
      tags:
        - Attribute
      summary: Add attribute value to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAttributeValueInput'
      responses:
        '201':
          description: Attribute value added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributeValue'
        '400':
          description: Invalid input
    get:
      tags:
        - Attribute
      summary: Get valid attribute values for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: List of valid attribute values
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductAttributeValue'
                  count:
                    type: integer
                  message:
                    type: string

    put:
      tags:
        - Attribute
      summary: Replace all attribute values for a product (replace mode)
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  type: array
                  description: List of attribute values to replace all current attributes for this product.
                  items:
                    $ref: '#/components/schemas/ProductAttributeValueInput'
      responses:
        '200':
          description: All attribute values replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid input

  /{productId}/attributes/all:
    get:
      tags:
        - Attribute
      summary: Get all attribute values for a product (including invalid ones)
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: List of all attribute values with validity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        product_id:
                          type: string
                        attribute_id:
                          oneOf:
                            - type: string
                            - type: object
                              properties:
                                _id:
                                  type: string
                                name:
                                  type: string
                                data_type:
                                  type: string
                                deleted_at:
                                  type: string
                                  format: date-time
                        value:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        has_valid_attribute:
                          type: boolean
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      valid:
                        type: integer
                      invalid:
                        type: integer
                  message:
                    type: string
  /{productId}/reviews:
    post:
      tags:
        - Review
      summary: Add a review to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductReviewInput'
      responses:
        '201':
          description: Review added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductReview'
        '400':
          description: Invalid input
    get:
      tags:
        - Review
      summary: Get all reviews for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductReview'
    delete:
      tags:
        - Review
      summary: Delete a review by ID
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
        - in: query
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      responses:
        '200':
          description: Review deleted
        '404':
          description: Review not found
  /{productId}/comments:
    post:
      tags:
        - Comment
      summary: Add a comment to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCommentInput'
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductComment'
        '400':
          description: Invalid input
    get:
      tags:
        - Comment
      summary: Get all comments for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Page size
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductComment'
    delete:
      tags:
        - Comment
      summary: Delete a comment by ID
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
        - in: query
          name: commentId
          required: true
          schema:
            type: string
          description: Comment ID
      responses:
        '200':
          description: Comment deleted
        '404':
          description: Comment not found
  /{productId}/tags:
    post:
      tags:
        - Tag
      summary: Add a tag to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTagInput'
      responses:
        '201':
          description: Tag added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTag'
        '400':
          description: Invalid input
    get:
      tags:
        - Tag
      summary: Get all tags for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductTag'
    delete:
      tags:
        - Tag
      summary: Delete a tag by ID
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
        - in: query
          name: tagId
          required: true
          schema:
            type: string
          description: Tag ID
      responses:
        '200':
          description: Tag deleted
        '404':
          description: Tag not found
  /{productId}/images:
    post:
      tags:
        - Image
      summary: Add an image to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductImageInput'
      responses:
        '201':
          description: Image added
          content:

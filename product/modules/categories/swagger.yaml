openapi: 3.0.0
info:
  title: Categories API
  version: 1.0.0
  description: Full API documentation for the Categories module (self-contained)

servers:
  - url: http://localhost:7011/api/product/v2
    description: Local server
  - url: http://87.248.138.74:8080/api/v1/product/categories
    description: Test server

security:
  - bearerAuth: []

paths:
  /:
    post:
      tags: [Categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
            example:
              name: "Digital Goods"
              slug: "digital-goods"
              parentId: null
              order: 0
              status: "active"
              img: "main-image.jpg"
              image_ids: ["img1", "img2"]
              meta_keywords: ["keyword1", "keyword2"]
              meta_title: "Meta Title"
              meta_description: "Meta description here."
              meta_helper: ["key1", "key2"]
              attribute_metadata:
                - name: "Color"
                  type: "enum"
                  required: false
                  order: 0
                  options:
                    - value: "Red"
                      order: 1
                      description: "Shade of the color"
                    - value: "Blue"
                      order: 2
                      description: "Shade of the color"
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    get:
      tags: [Categories]
      summary: Get all categories
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: sort
          schema:
            type: string
            example: '{"order":1}'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: parentId
          schema:
            type: string
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /tree:
    get:
      tags: [Categories]
      summary: Get category tree
      parameters:
        - in: query
          name: maxDepth
          schema:
            type: integer
          description: Maximum depth of tree
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /featured:
    get:
      tags: [Categories]
      summary: Get featured categories
      responses:
        '200':
          description: Featured categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /search:
    get:
      tags: [Categories]
      summary: Search categories
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: sort
          schema:
            type: string
            example: '{"order":1}'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: parentId
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /search/advanced:
    get:
      tags: [Categories]
      summary: Advanced search for categories
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: sort
          schema:
            type: string
            example: '{"order":1}'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: level
          schema:
            type: integer
        - in: query
          name: parentId
          schema:
            type: string
        - in: query
          name: slug
          schema:
            type: string
      responses:
        '200':
          description: Advanced search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /slug/{slug}:
    get:
      tags: [Categories]
      summary: Get category by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /{id}:
    get:
      tags: [Categories]
      summary: Get category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    put:
      tags: [Categories]
      summary: Update category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateInput'
            example:
              name: "Updated Name"
              slug: "updated-name"
              parentId: null
              order: 1
              status: "active"
              img: "main-image.jpg"
              image_ids: ["img1", "img2"]
              meta_keywords: ["keyword1", "keyword2"]
              meta_title: "Meta Title"
              meta_description: "Meta description here."
              meta_helper: ["key1", "key2"]
              attribute_metadata:
                - name: "Color"
                  type: "enum"
                  required: false
                  order: 0
                  options:
                    - value: "Red"
                      order: 1
                      description: "Shade of the color"
                    - value: "Blue"
                      order: 2
                      description: "Shade of the color"
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags: [Categories]
      summary: Delete category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted
  /{id}/attributes:
    post:
      tags: [Category Attributes]
      summary: Add attribute to category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAttributeInput'
            example:
              name: "Color"
              type: "select"
              options: ["Red", "Blue", "Green"]
      responses:
        '201':
          description: Attribute added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttribute'
    get:
      tags: [Category Attributes]
      summary: Get attributes of a category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of attributes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryAttribute'
  /attributes/{attributeId}:
    put:
      tags: [Category Attributes]
      summary: Update attribute
      parameters:
        - in: path
          name: attributeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAttributeInput'
      responses:
        '200':
          description: Attribute updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttribute'
    delete:
      tags: [Category Attributes]
      summary: Delete attribute
      parameters:
        - in: path
          name: attributeId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Attribute deleted
  /attributes/{attributeId}/options:
    post:
      tags: [Category Attributes]
      summary: Add option to attribute
      parameters:
        - in: path
          name: attributeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAttributeOptionInput'
            example:
              value: "Red"
              order: 1
      responses:
        '201':
          description: Option added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttributeOption'
    get:
      tags: [Category Attributes]
      summary: Get options of an attribute (with inherited flag)
      parameters:
        - in: path
          name: attributeId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryAttributeOption'
  /attributes/options/{optionId}:
    put:
      tags: [Category Attributes]
      summary: Update option
      parameters:
        - in: path
          name: optionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAttributeOptionInput'
      responses:
        '200':
          description: Option updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttributeOption'
    delete:
      tags: [Category Attributes]
      summary: Delete option
      parameters:
        - in: path
          name: optionId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Option deleted
  /{id}/redirects:
    post:
      tags: [Categories]
      summary: Add slug redirect
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldSlug:
                  type: string
      responses:
        '201':
          description: Slug redirect added
    get:
      tags: [Categories]
      summary: Get slug redirects
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of slug redirects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /{id}/redirects/{oldSlug}:
    delete:
      tags: [Categories]
      summary: Remove slug redirect
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: oldSlug
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Slug redirect removed
  /export/{format}:
    get:
      tags: [Categories]
      summary: Export categories
      parameters:
        - in: path
          name: format
          required: true
          schema:
            type: string
            enum: [json, csv, xml]
      responses:
        '200':
          description: Exported data
  /import:
    post:
      tags: [Categories]
      summary: Import categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [json, csv, xml]
                data:
                  type: string
      responses:
        '201':
          description: Categories imported
  /{id}/clone:
    post:
      tags: [Categories]
      summary: Clone a category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newName:
                  type: string
                newParentId:
                  type: string
      responses:
        '201':
          description: Category cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /templates/{templateId}:
    get:
      tags: [Categories]
      summary: Get category template
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /templates/{templateId}/create:
    post:
      tags: [Categories]
      summary: Create category from template
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created from template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /{id}/submit-approval:
    post:
      tags: [Approval]
      summary: Submit category for approval
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryApprovalInput'
      responses:
        '200':
          description: Category submitted for approval
  /{id}/approve:
    post:
      tags: [Approval]
      summary: Approve category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryApprovalInput'
      responses:
        '200':
          description: Category approved
  /{id}/reject:
    post:
      tags: [Approval]
      summary: Reject category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryApprovalInput'
      responses:
        '200':
          description: Category rejected
  /reorder:
    post:
      tags: [Categories]
      summary: Reorder categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderedIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Categories reordered
  /status/{status}:
    get:
      tags: [Categories]
      summary: Get categories by status
      parameters:
        - in: path
          name: status
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of categories by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /level/{level}:
    get:
      tags: [Categories]
      summary: Get categories by level
      parameters:
        - in: path
          name: level
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of categories by level
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /parent/{parentId}:
    get:
      tags: [Categories]
      summary: Get categories by parent
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of categories by parent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /{id}/analytics:
    get:
      tags: [Analytics]
      summary: Get category analytics
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: metrics
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Comma-separated list of metrics to include (e.g. subcategories,attributes,options)
        - in: query
          name: dateRange
          schema:
            type: string
          description: Date range for analytics (e.g. '30d', '2023-01-01:2023-01-31')
        - in: query
          name: groupBy
          schema:
            type: string
          description: Grouping for analytics (e.g. 'day', 'month')
        - in: query
          name: includeSubcategories
          schema:
            type: boolean
          description: Whether to include subcategories (default: true)
        - in: query
          name: includeProducts
          schema:
            type: boolean
          description: Whether to include products (future use)
        - in: query
          name: includeAttributes
          schema:
            type: boolean
          description: Whether to include attributes (default: true)
      responses:
        '200':
          description: Category analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
                  stats:
                    type: object
                    description: Analytics metrics
  /{id}/performance:
    get:
      tags: [Analytics]
      summary: Get category performance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: metrics
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Comma-separated list of metrics to include (e.g. totalDescendants,level,attributes)
        - in: query
          name: dateRange
          schema:
            type: string
          description: Date range for performance (e.g. '30d', '2023-01-01:2023-01-31')
      responses:
        '200':
          description: Category performance
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
                  performance:
                    type: object
                    description: Performance metrics
  /{id}/insights:
    get:
      tags: [Analytics]
      summary: Get category insights
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: metrics
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Comma-separated list of insights to include (e.g. mostOptionsAttribute,maxOptions,totalAttributes)
      responses:
        '200':
          description: Category insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  insights:
                    type: object
                    description: Insights metrics
  /{id}/growth:
    get:
      tags: [Analytics]
      summary: Get category growth
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: metrics
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Comma-separated list of growth metrics to include (e.g. totalDescendants)
        - in: query
          name: periods
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Comma-separated list of periods for growth analysis (e.g. 7d,30d,1y)
      responses:
        '200':
          description: Category growth
          content:
            application/json:
              schema:
                type: object
                properties:
                  growth:
                    type: object
                    description: Growth metrics
  /comparison:
    post:
      tags: [Analytics]
      summary: Get comparison report for categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryIds:
                  type: array
                  items:
                    type: string
      parameters:
        - in: query
          name: metrics
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Comma-separated list of metrics to include in comparison (e.g. descendants,attributes)
        - in: query
          name: dateRange
          schema:
            type: string
          description: Date range for comparison (e.g. '30d', '2023-01-01:2023-01-31')
      responses:
        '200':
          description: Comparison report
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    descendants:
                      type: integer
                    attributes:
                      type: integer
  /legacy-tree:
    get:
      tags: [Categories]
      summary: Get legacy category tree
      responses:
        '200':
          description: Legacy tree
  /attributes:
    get:
      tags: [Category Attributes]
      summary: Get all attributes (with pagination, filter, search)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: sort
          schema:
            type: string
            example: '{"order":1}'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
      responses:
        '200':
          description: List of attributes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryAttribute'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /attributes/search:
    post:
      tags: [Category Attributes]
      summary: Deep search categories by attribute values
      description: جستجوی پیشرفته دسته‌بندی‌ها بر اساس attribute و مقدارهای آن‌ها. خروجی شامل اطلاعات کامل هر دسته‌بندی و attribute/valueهای آن است.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of items per page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      attribute:
                        type: string
                        description: Name of the attribute to filter by
                        example: "brand"
                      values:
                        type: array
                        items:
                          type: string
                        description: Array of values to match for this attribute
                        example: ["apple", "samsung"]
                  description: Array of attribute filters (AND logic between filters, OR logic within each filter's values)
                slugs:
                  type: array
                  items:
                    type: string
                  description: Array of category slugs to filter by
                  example: ["electronics", "phones"]
            example:
              filters:
                - attribute: "brand"
                  values: ["apple", "samsung"]
                - attribute: "color"
                  values: ["red", "blue"]
              slugs: ["electronics", "phones"]
              page: 1
              limit: 20
      responses:
        '200':
          description: Search results with categories and their attributes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          $ref: '#/components/schemas/Category'
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              attribute:
                                type: string
                                example: "brand"
                              value:
                                type: string
                                example: "apple"
                  count:
                    type: integer
                    description: Number of items in current page
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Number of items per page
                  total:
                    type: integer
                    description: Total number of matching categories
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "At least one of filters or slugs must be provided"
  /attributes/bulk:
    put:
      tags: [Category Attributes]
      summary: Bulk update attributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/CategoryAttribute'
      responses:
        '200':
          description: Bulk update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  success:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        success:
                          type: boolean
                        error:
                          type: string
    delete:
      tags: [Category Attributes]
      summary: Bulk delete attributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attributeIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  success:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        deleted:
                          type: boolean
                        error:
                          type: string
  /{categoryId}/attributes/inherited:
    get:
      tags: [Category Attributes]
      summary: Get all attributes of a category including inherited from parents
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of attributes (with inherited flag)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryAttribute'


openapi: 3.0.0
info:
  title: Minio API
  version: 1.0.0
  description: API documentation for Minio file service
servers:
  - url: http://localhost:7004
paths:
  /upload:
    post:
      summary: Upload a file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded successfully
  /download/{id}:
    get:
      summary: Download a file by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File downloaded
  /{id}:
    get:
      summary: Get file info by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File info
  /:
    get:
      summary: List all files
      responses:
        '200':
          description: List of files 
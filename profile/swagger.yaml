openapi: 3.0.0
info:
  title: User Profile Service API
  version: 1.1.0
  description: API for managing user profiles, addresses, devices, notifications, blocks, preferences, settings, social links, activity logs, favorites, and recent views
servers:
  - url: http://localhost:5005
paths:
  /profiles:
    get:
      summary: List and search user profiles
      description: Returns a paginated list of user profiles. Supports filtering by first_name, last_name, email, mobile, gender.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: first_name
          schema:
            type: string
        - in: query
          name: last_name
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: mobile
          schema:
            type: string
        - in: query
          name: gender
          schema:
            type: string
            enum: [male, female, other]
      responses:
        '200':
          description: Paginated list of profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              examples:
                example:
                  value:
                    items:
                      - user_id: "u1"
                        first_name: "Ali"
                        last_name: "Ahmadi"
                        email: "ali@example.com"
                        mobile: "+989121234567"
                        gender: "male"
                    pagination:
                      page: 1
                      limit: 20
                      total: 1
                      totalPages: 1
    post:
      summary: Create user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
            example:
              user_id: "u1"
              first_name: "Ali"
              last_name: "Ahmadi"
              email: "ali@example.com"
              mobile: "+989121234567"
              gender: "male"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: Profile already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profiles/{userId}:
    get:
      summary: Get user profile
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update user profile
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete user profile
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profiles/{userId}/addresses:
    get:
      summary: List user addresses
      description: Returns a paginated list of addresses for a user. Supports filtering by city, province, country, is_default.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: province
          schema:
            type: string
        - in: query
          name: country
          schema:
            type: string
        - in: query
          name: is_default
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAddress'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Add address
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddress'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
  /profiles/{userId}/addresses/{addressId}:
    put:
      summary: Update address
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: addressId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddress'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete address
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: addressId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profiles/{userId}/devices:
    get:
      summary: List user devices
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDevice'
    post:
      summary: Register a new device
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDevice'
      responses:
        '201':
          description: Device registered
  /devices/{id}/login:
    put:
      summary: Update device last login
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Device login updated
  /devices/{id}:
    delete:
      summary: Remove device
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Device removed
  /profiles/{userId}/notifications:
    get:
      summary: List user notifications
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
        - in: query
          name: onlyUnread
          schema: { type: boolean }
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserNotification'
    post:
      summary: Create notification
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserNotification'
      responses:
        '201':
          description: Notification created
  /notifications/{id}/read:
    put:
      summary: Mark notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Notification marked as read
  /notifications/{id}:
    delete:
      summary: Remove notification
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Notification removed
  /profiles/{userId}/blocks:
    get:
      summary: List user blocks
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBlock'
  /users/{userId}/blocks/user:
    post:
      summary: Block a user
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockedUserId]
              properties:
                blockedUserId:
                  type: integer
      responses:
        '201':
          description: User blocked
  /users/{userId}/blocks/item:
    post:
      summary: Block an item
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockedItemId, blockedItemType]
              properties:
                blockedItemId:
                  type: integer
                blockedItemType:
                  type: string
      responses:
        '201':
          description: Item blocked
  /blocks/{id}:
    delete:
      summary: Unblock
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Unblocked
  /profiles/{userId}/preferences:
    get:
      summary: List user preferences
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPreference'
    post:
      summary: Set preference
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreference'
      responses:
        '201':
          description: Preference set
  /preferences/{id}:
    delete:
      summary: Remove preference
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Preference removed
  /profiles/{userId}/settings:
    get:
      summary: List user settings
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSetting'
    post:
      summary: Create setting
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSetting'
      responses:
        '201':
          description: Setting created
  /settings/{id}:
    put:
      summary: Update setting
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSetting'
      responses:
        '200':
          description: Setting updated
    delete:
      summary: Remove setting
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Setting removed
  /profiles/{userId}/social-links:
    get:
      summary: List user social links
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of social links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSocialLink'
    post:
      summary: Create social link
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSocialLink'
      responses:
        '201':
          description: Social link created
  /social-links/{id}:
    put:
      summary: Update social link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSocialLink'
      responses:
        '200':
          description: Social link updated
    delete:
      summary: Remove social link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Social link removed
  /profiles/{userId}/activity-logs:
    get:
      summary: List user activity logs
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserActivityLog'
    post:
      summary: Log activity
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActivityLog'
      responses:
        '201':
          description: Activity logged
components:
  schemas:
    UserProfile:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: Unique user identifier
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        mobile:
          type: string
        avatar_image_id:
          type: string
        birthdate:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
    UserAddress:
      type: object
      required:
        - address_line
      properties:
        title:
          type: string
        address_line:
          type: string
          description: Main address line
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string
        country:
          type: string
        is_default:
          type: boolean
          description: Is this the default address for the user?
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
          nullable: true
    UserDevice:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        deviceId: { type: string }
        deviceType: { type: string }
        lastLogin: { type: string, format: date-time }
    UserNotification:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        type: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    UserBlock:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        blockedUserId: { type: integer }
        blockedItemId: { type: integer }
        blockedItemType: { type: string }
        createdAt: { type: string, format: date-time }
    UserPreference:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        key: { type: string }
        value: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserSetting:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        key: { type: string }
        value: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserSocialLink:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        platform: { type: string }
        url: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserActivityLog:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        action: { type: string }
        meta: { type: object }
        createdAt: { type: string, format: date-time } 
openapi: 3.0.0
info:
  title: User Profile Service API
  version: 1.0.0
  description: API for managing user profiles and addresses
servers:
  - url: http://localhost:5005
paths:
  /profiles:
    get:
      summary: List and search user profiles
      description: Returns a paginated list of user profiles. Supports filtering by first_name, last_name, email, mobile, gender.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: first_name
          schema:
            type: string
        - in: query
          name: last_name
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: mobile
          schema:
            type: string
        - in: query
          name: gender
          schema:
            type: string
            enum: [male, female, other]
      responses:
        '200':
          description: Paginated list of profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              examples:
                example:
                  value:
                    items:
                      - user_id: "u1"
                        first_name: "Ali"
                        last_name: "Ahmadi"
                        email: "ali@example.com"
                        mobile: "+989121234567"
                        gender: "male"
                    pagination:
                      page: 1
                      limit: 20
                      total: 1
                      totalPages: 1
    post:
      summary: Create user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
            example:
              user_id: "u1"
              first_name: "Ali"
              last_name: "Ahmadi"
              email: "ali@example.com"
              mobile: "+989121234567"
              gender: "male"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: Profile already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profiles/{userId}:
    get:
      summary: Get user profile
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update user profile
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete user profile
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profiles/{userId}/addresses:
    get:
      summary: List user addresses
      description: Returns a paginated list of addresses for a user. Supports filtering by city, province, country, is_default.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: province
          schema:
            type: string
        - in: query
          name: country
          schema:
            type: string
        - in: query
          name: is_default
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAddress'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Add address
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddress'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
  /profiles/{userId}/addresses/{addressId}:
    put:
      summary: Update address
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: addressId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddress'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete address
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: addressId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    UserProfile:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: Unique user identifier
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        mobile:
          type: string
        avatar_image_id:
          type: string
        birthdate:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
    UserAddress:
      type: object
      required:
        - address_line
      properties:
        title:
          type: string
        address_line:
          type: string
          description: Main address line
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string
        country:
          type: string
        is_default:
          type: boolean
          description: Is this the default address for the user?
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
          nullable: true 
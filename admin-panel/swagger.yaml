openapi: 3.0.0
info:
  title: "پنل مدیریت پایگاه داده (Database Admin Panel)"
  description: "مستندات API برای مدیریت و مشاهده پایگاه داده‌های PostgreSQL. این API فقط خواندنی است و برای مشاهده اطلاعات دیتابیس، جداول و ساختار آن‌ها استفاده می‌شود."
  version: "1.0.0"
servers:
  - url: http://localhost:7002
    description: "لوکال هاست (پیش‌فرض)"
tags:
  - name: AdminPanel
    description: "روترهای پنل مدیریت دیتابیس"
paths:
  /:
    get:
      tags: [AdminPanel]
      summary: "دریافت صفحه HTML پنل مدیریت"
      description: "صفحه اصلی HTML پنل مدیریت دیتابیس را باز می‌گرداند."
      responses:
        '200':
          description: "صفحه HTML پنل مدیریت"
          content:
            text/html:
              schema:
                type: string
  /databases:
    get:
      tags: [AdminPanel]
      summary: "لیست دیتابیس‌ها"
      description: "لیست تمام دیتابیس‌های موجود (به جز templateها) را باز می‌گرداند."
      responses:
        '200':
          description: "لیست نام دیتابیس‌ها"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
                    example: Success
        '500':
          description: "خطای سرور"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tables:
    get:
      tags: [AdminPanel]
      summary: "لیست جداول دیتابیس"
      description: "لیست تمام جداول دیتابیس انتخاب‌شده را با اطلاعات آماری باز می‌گرداند."
      parameters:
        - in: query
          name: database
          schema:
            type: string
          description: "نام دیتابیس (اختیاری، پیش‌فرض: دیتابیس اصلی)"
      responses:
        '200':
          description: "لیست جداول دیتابیس با اطلاعات آماری"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TableInfo'
                  message:
                    type: string
                    example: Success
        '500':
          description: "خطای سرور"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tables/{tableName}:
    get:
      tags: [AdminPanel]
      summary: "دریافت داده‌های جدول با صفحه‌بندی"
      description: "داده‌های جدول انتخاب‌شده را با اطلاعات ساختاری و صفحه‌بندی باز می‌گرداند."
      parameters:
        - in: path
          name: tableName
          required: true
          schema:
            type: string
          description: "نام جدول"
        - in: query
          name: database
          schema:
            type: string
          description: "نام دیتابیس (اختیاری)"
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: "شماره صفحه (پیش‌فرض: 1)"
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: "تعداد رکورد در هر صفحه (پیش‌فرض: 50)"
      responses:
        '200':
          description: "داده‌های جدول با اطلاعات ساختاری و صفحه‌بندی"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      table_info:
                        $ref: '#/components/schemas/TablePageInfo'
                      columns:
                        type: array
                        items:
                          $ref: '#/components/schemas/ColumnInfo'
                      constraints:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConstraintInfo'
                      indexes:
                        type: array
                        items:
                          $ref: '#/components/schemas/IndexInfo'
                      statistics:
                        type: array
                        items:
                          $ref: '#/components/schemas/StatInfo'
                      rows:
                        type: array
                        items:
                          type: object
                  message:
                    type: string
                    example: Success
        '500':
          description: "خطای سرور"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /overview:
    get:
      tags: [AdminPanel]
      summary: "نمای کلی دیتابیس"
      description: "آمار کلی دیتابیس انتخاب‌شده شامل حجم، تعداد جداول، تعداد ردیف‌ها و ... را باز می‌گرداند."
      parameters:
        - in: query
          name: database
          schema:
            type: string
          description: "نام دیتابیس (اختیاری)"
      responses:
        '200':
          description: "آمار کلی دیتابیس"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      database_info:
                        $ref: '#/components/schemas/DatabaseInfo'
                      largest_tables:
                        type: array
                        items:
                          $ref: '#/components/schemas/LargestTableInfo'
                      recent_activity:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecentActivityInfo'
                      last_updated:
                        type: string
                        format: date-time
                  message:
                    type: string
                    example: Success
        '500':
          description: "خطای سرور"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tables/{tableName}/relationships:
    get:
      tags: [AdminPanel]
      summary: "دریافت روابط جدول (کلید خارجی)"
      description: "روابط کلید خارجی جدول انتخاب‌شده را باز می‌گرداند."
      parameters:
        - in: path
          name: tableName
          required: true
          schema:
            type: string
          description: "نام جدول"
        - in: query
          name: database
          schema:
            type: string
          description: "نام دیتابیس (اختیاری)"
      responses:
        '200':
          description: "روابط کلید خارجی جدول"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      table_name:
                        type: string
                      relationships:
                        type: array
                        items:
                          $ref: '#/components/schemas/RelationshipInfo'
                  message:
                    type: string
                    example: Success
        '500':
          description: "خطای سرور"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tables/{tableName}/structure:
    get:
      tags: [AdminPanel]
      summary: "دریافت ساختار جدول"
      description: "اطلاعات ساختاری (ستون‌ها و ایندکس‌ها) جدول انتخاب‌شده را باز می‌گرداند."
      parameters:
        - in: path
          name: tableName
          required: true
          schema:
            type: string
          description: "نام جدول"
        - in: query
          name: database
          schema:
            type: string
          description: "نام دیتابیس (اختیاری)"
      responses:
        '200':
          description: "ساختار جدول و ایندکس‌ها"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      table_name:
                        type: string
                      structure:
                        type: array
                        items:
                          $ref: '#/components/schemas/ColumnInfo'
                      indexes:
                        type: array
                        items:
                          $ref: '#/components/schemas/IndexInfo'
                  message:
                    type: string
                    example: Success
        '500':
          description: "خطای سرور"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        data:
          type: object
          nullable: true
        details:
          type: object
          nullable: true
    TableInfo:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        estimated_rows:
          type: integer
        actual_rows:
          type: integer
        size:
          type: string
        last_updated:
          type: string
          format: date-time
    TablePageInfo:
      type: object
      properties:
        name:
          type: string
        total_rows:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer
    ColumnInfo:
      type: object
      properties:
        column_name:
          type: string
        data_type:
          type: string
        is_nullable:
          type: string
        column_default:
          type: string
          nullable: true
        character_maximum_length:
          type: integer
          nullable: true
        numeric_precision:
          type: integer
          nullable: true
        numeric_scale:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
    ConstraintInfo:
      type: object
      properties:
        constraint_name:
          type: string
        constraint_type:
          type: string
        column_name:
          type: string
        foreign_table_name:
          type: string
          nullable: true
        foreign_column_name:
          type: string
          nullable: true
    IndexInfo:
      type: object
      properties:
        indexname:
          type: string
        indexdef:
          type: string
        indisunique:
          type: boolean
        indisprimary:
          type: boolean
        indisclustered:
          type: boolean
    StatInfo:
      type: object
      properties:
        schemaname:
          type: string
        tablename:
          type: string
        attname:
          type: string
        n_distinct:
          type: number
        correlation:
          type: number
        most_common_vals:
          type: string
        most_common_freqs:
          type: string
    DatabaseInfo:
      type: object
      properties:
        name:
          type: string
        size:
          type: string
        size_bytes:
          type: integer
        total_tables:
          type: integer
        total_estimated_rows:
          type: integer
    LargestTableInfo:
      type: object
      properties:
        table_name:
          type: string
        size:
          type: string
        estimated_rows:
          type: integer
    RecentActivityInfo:
      type: object
      properties:
        schemaname:
          type: string
        tablename:
          type: string
        last_vacuum:
          type: string
          nullable: true
        last_autovacuum:
          type: string
          nullable: true
        last_analyze:
          type: string
          nullable: true
        last_autoanalyze:
          type: string
          nullable: true
    RelationshipInfo:
      type: object
      properties:
        table_name:
          type: string
        column_name:
          type: string
        foreign_table_name:
          type: string
        foreign_column_name:
          type: string
        constraint_name:
          type: string

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Admin Panel - Read Only</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #3b82f6;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-badge {
            background: var(--success-color);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-hover);
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 80px);
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            background: var(--bg-primary);
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .table-list {
            list-style: none;
        }

        .table-item {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.25rem;
            border: 1px solid transparent;
        }

        .table-item:hover {
            background: var(--bg-secondary);
            border-color: var(--border-color);
        }

        .table-item.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .table-item.active .table-name {
            color: white;
        }

        .table-item.active .table-count {
            color: rgba(255, 255, 255, 0.8);
        }

        .table-name {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .table-icon {
            font-size: 0.875rem;
            opacity: 0.7;
        }

        .table-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .table-size {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 1.5rem;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .content-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .content-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        /* Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .stat-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .stat-icon.blue {
            background: rgb(59 130 246 / 0.1);
            color: var(--info-color);
        }

        .stat-icon.green {
            background: rgb(16 185 129 / 0.1);
            color: var(--success-color);
        }

        .stat-icon.orange {
            background: rgb(245 158 11 / 0.1);
            color: var(--warning-color);
        }

        .stat-icon.purple {
            background: rgb(99 102 241 / 0.1);
            color: var(--primary-color);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .stat-change {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Table View */
        .table-container {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .table-toolbar {
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .table-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .table-actions {
            display: flex;
            gap: 0.5rem;
        }

        .table-content {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: var(--bg-secondary);
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .data-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
            vertical-align: top;
        }

        .data-table tr:hover {
            background: var(--bg-secondary);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        /* Data Display */
        .cell-content {
            max-width: 300px;
            word-break: break-word;
        }

        .cell-null {
            color: var(--text-muted);
            font-style: italic;
        }

        .cell-boolean {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .cell-boolean.true {
            background: rgb(16 185 129 / 0.1);
            color: var(--success-color);
        }

        .cell-boolean.false {
            background: rgb(239 68 68 / 0.1);
            color: var(--danger-color);
        }

        .cell-json {
            background: var(--bg-tertiary);
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .cell-text-long {
            position: relative;
        }

        .cell-text-long .text-preview {
            max-height: 3rem;
            overflow: hidden;
            position: relative;
        }

        .cell-text-long .text-preview::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 1rem;
            background: linear-gradient(transparent, var(--bg-primary));
        }

        .cell-text-long .text-full {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.75rem;
            box-shadow: var(--shadow-lg);
            z-index: 100;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
        }

        .cell-text-long:hover .text-full {
            display: block;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .pagination button {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin: 0 1rem;
        }

        /* Loading & Error States */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 2rem;
            height: 2rem;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-container {
            background: rgb(239 68 68 / 0.1);
            border: 1px solid rgb(239 68 68 / 0.2);
            color: var(--danger-color);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin: 1rem 0;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 300px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .table-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .table-info {
                justify-content: center;
            }

            .table-actions {
                justify-content: center;
            }
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="header-title">
                    <i class="fas fa-database"></i>
                    Database Admin Panel
                    <span class="header-badge">Read Only</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary btn-sm" onclick="adminPanel.refreshAll()">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                </button>
                <button class="btn btn-primary btn-sm" onclick="adminPanel.showOverview()">
                    <i class="fas fa-chart-bar"></i>
                    Overview
                </button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="tableSearch" class="search-input" placeholder="Search tables...">
                </div>
            </div>
            <div class="sidebar-content">
                <ul class="table-list" id="tableList">
                    <li class="loading-container">
                        <div class="loading-spinner"></div>
                        <div>Loading tables...</div>
                    </li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <div id="content">
                <div class="loading-container">
                    <i class="fas fa-table" style="font-size: 3rem; opacity: 0.5; margin-bottom: 1rem;"></i>
                    <div>Select a table to view data</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class DatabaseAdminPanel {
            constructor() {
                this.currentTable = null;
                this.currentPage = 1;
                this.pageSize = 50;
                this.tables = [];
                this.overview = null;
                this.init();
            }

            async init() {
                await this.loadOverview();
                await this.loadTables();
                this.setupEventListeners();
                this.showOverview();
            }

            setupEventListeners() {
                document.getElementById('tableSearch').addEventListener('input', (e) => {
                    this.filterTables(e.target.value);
                });

                // Auto-refresh every 30 seconds
                setInterval(() => {
                    if (this.currentTable) {
                        this.fetchTableData();
                    }
                }, 30000);
            }

            async loadOverview() {
                try {
                    const response = await fetch('/api/admin/overview');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'success') {
                            this.overview = data.data;
                        }
                    }
                } catch (error) {
                    console.error('Failed to load overview:', error);
                }
            }

            async loadTables() {
                try {
                    const response = await fetch('/api/admin/tables');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    if (data.status === 'success') {
                        this.tables = data.data;
                        this.renderTableList();
                    } else {
                        throw new Error(data.message || 'Unknown error');
                    }
                } catch (error) {
                    console.error('Error loading tables:', error);
                    this.showError('Failed to load tables: ' + error.message);
                }
            }

            renderTableList() {
                const tableList = document.getElementById('tableList');
                tableList.innerHTML = '';

                this.tables.forEach(table => {
                    const li = document.createElement('li');
                    li.className = 'table-item';
                    li.innerHTML = `
                        <div class="table-name">
                            <i class="fas fa-table table-icon"></i>
                            ${table.name}
                        </div>
                        <div class="table-count">
                            <i class="fas fa-list"></i>
                            ${table.actual_rows?.toLocaleString() || table.estimated_rows?.toLocaleString() || '0'} rows
                        </div>
                        <div class="table-size">
                            <i class="fas fa-hdd"></i>
                            ${table.size || '0 kB'}
                        </div>
                    `;
                    li.addEventListener('click', () => this.loadTableData(table.name));
                    tableList.appendChild(li);
                });
            }

            filterTables(searchTerm) {
                const tableItems = document.querySelectorAll('.table-item');
                tableItems.forEach(item => {
                    const tableName = item.querySelector('.table-name').textContent.toLowerCase();
                    if (tableName.includes(searchTerm.toLowerCase())) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }

            async loadTableData(tableName) {
                this.currentTable = tableName;
                this.currentPage = 1;
                
                // Update active state
                document.querySelectorAll('.table-item').forEach(item => {
                    item.classList.remove('active');
                });
                event.target.closest('.table-item').classList.add('active');

                this.showLoading();
                await this.fetchTableData();
            }

            async fetchTableData() {
                try {
                    const response = await fetch(`/api/admin/tables/${this.currentTable}?page=${this.currentPage}&limit=${this.pageSize}`);
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        this.renderTableData(data.data);
                    } else {
                        throw new Error(data.message);
                    }
                } catch (error) {
                    this.showError('Failed to load table data: ' + error.message);
                }
            }

            renderTableData(data) {
                const content = document.getElementById('content');
                
                if (!data.rows || data.rows.length === 0) {
                    content.innerHTML = `
                        <div class="content-header">
                            <div class="content-title">${this.currentTable}</div>
                            <div class="content-subtitle">No data available</div>
                        </div>
                        <div class="content-body">
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <div>This table is empty</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                const columns = Object.keys(data.rows[0] || {});
                const rows = data.rows;
                const totalRows = data.table_info?.total_rows || rows.length;

                let tableHTML = `
                    <div class="content-header">
                        <div class="content-title">${this.currentTable}</div>
                        <div class="content-subtitle">Database table with ${totalRows.toLocaleString()} total rows</div>
                    </div>
                    <div class="content-body">
                        <div class="table-container">
                            <div class="table-toolbar">
                                <div class="table-info">
                                    <div class="info-item">
                                        <i class="fas fa-list"></i>
                                        ${totalRows.toLocaleString()} total rows
                                    </div>
                                    <div class="info-item">
                                        <i class="fas fa-columns"></i>
                                        ${columns.length} columns
                                    </div>
                                    <div class="info-item">
                                        <i class="fas fa-file-alt"></i>
                                        Page ${this.currentPage} of ${Math.ceil(totalRows / this.pageSize)}
                                    </div>
                                </div>
                                <div class="table-actions">
                                    <button class="btn btn-secondary btn-sm" onclick="adminPanel.fetchTableData()">
                                        <i class="fas fa-sync-alt"></i>
                                        Refresh
                                    </button>
                                    <button class="btn btn-primary btn-sm" onclick="adminPanel.showTableStructure()">
                                        <i class="fas fa-cog"></i>
                                        Structure
                                    </button>
                                </div>
                            </div>
                            <div class="table-content">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            ${columns.map(col => `<th>${col}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>
                `;

                rows.forEach(row => {
                    tableHTML += '<tr>';
                    columns.forEach(col => {
                        const value = row[col];
                        tableHTML += `<td><div class="cell-content">${this.formatCellValue(value)}</div></td>`;
                    });
                    tableHTML += '</tr>';
                });

                tableHTML += `
                                    </tbody>
                                </table>
                            </div>
                `;

                // Add pagination if needed
                if (totalRows > this.pageSize) {
                    tableHTML += this.renderPagination(totalRows);
                }

                tableHTML += '</div></div>';
                content.innerHTML = tableHTML;
            }

            formatCellValue(value) {
                if (value === null || value === undefined) {
                    return '<span class="cell-null">null</span>';
                }
                
                if (typeof value === 'boolean') {
                    return `<span class="cell-boolean ${value}">${value ? '✓' : '✗'} ${value}</span>`;
                }
                
                if (typeof value === 'object') {
                    return `<div class="cell-json">${JSON.stringify(value, null, 2)}</div>`;
                }
                
                if (typeof value === 'string' && value.length > 100) {
                    return `
                        <div class="cell-text-long">
                            <div class="text-preview">${value}</div>
                            <div class="text-full">${value}</div>
                        </div>
                    `;
                }
                
                return String(value);
            }

            renderPagination(totalRows) {
                const totalPages = Math.ceil(totalRows / this.pageSize);
                const currentPage = this.currentPage;

                return `
                    <div class="pagination">
                        <button onclick="adminPanel.goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>
                            <i class="fas fa-angle-double-left"></i>
                        </button>
                        <button onclick="adminPanel.goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                            <i class="fas fa-angle-left"></i>
                        </button>
                        <div class="pagination-info">
                            Page ${currentPage} of ${totalPages}
                        </div>
                        <button onclick="adminPanel.goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                            <i class="fas fa-angle-right"></i>
                        </button>
                        <button onclick="adminPanel.goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>
                            <i class="fas fa-angle-double-right"></i>
                        </button>
                    </div>
                `;
            }

            async goToPage(page) {
                this.currentPage = page;
                await this.fetchTableData();
            }

            showOverview() {
                const content = document.getElementById('content');
                
                if (!this.overview) {
                    content.innerHTML = `
                        <div class="content-header">
                            <div class="content-title">Database Overview</div>
                            <div class="content-subtitle">Loading database statistics...</div>
                        </div>
                        <div class="content-body">
                            <div class="loading-container">
                                <div class="loading-spinner"></div>
                                <div>Loading overview...</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                const db = this.overview.database_info;
                const largestTables = this.overview.largest_tables || [];

                content.innerHTML = `
                    <div class="content-header">
                        <div class="content-title">Database Overview</div>
                        <div class="content-subtitle">${db.name} • Last updated: ${new Date(this.overview.last_updated).toLocaleString()}</div>
                    </div>
                    <div class="content-body">
                        <div class="dashboard">
                            <div class="stat-card">
                                <div class="stat-header">
                                    <div class="stat-title">Total Tables</div>
                                    <div class="stat-icon blue">
                                        <i class="fas fa-table"></i>
                                    </div>
                                </div>
                                <div class="stat-value">${db.total_tables.toLocaleString()}</div>
                                <div class="stat-change">Active database tables</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="stat-header">
                                    <div class="stat-title">Total Rows</div>
                                    <div class="stat-icon green">
                                        <i class="fas fa-list"></i>
                                    </div>
                                </div>
                                <div class="stat-value">${db.total_estimated_rows.toLocaleString()}</div>
                                <div class="stat-change">Estimated across all tables</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="stat-header">
                                    <div class="stat-title">Database Size</div>
                                    <div class="stat-icon orange">
                                        <i class="fas fa-hdd"></i>
                                    </div>
                                </div>
                                <div class="stat-value">${db.size}</div>
                                <div class="stat-change">Total storage used</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="stat-header">
                                    <div class="stat-title">Active Tables</div>
                                    <div class="stat-icon purple">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                </div>
                                <div class="stat-value">${this.tables.length}</div>
                                <div class="stat-change">Currently loaded</div>
                            </div>
                        </div>

                        <div class="table-container">
                            <div class="table-toolbar">
                                <div class="table-info">
                                    <div class="info-item">
                                        <i class="fas fa-chart-bar"></i>
                                        Largest Tables by Size
                                    </div>
                                </div>
                            </div>
                            <div class="table-content">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Table Name</th>
                                            <th>Size</th>
                                            <th>Estimated Rows</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${largestTables.map(table => `
                                            <tr>
                                                <td>
                                                    <div class="cell-content">
                                                        <i class="fas fa-table" style="margin-right: 0.5rem; opacity: 0.7;"></i>
                                                        ${table.table_name}
                                                    </div>
                                                </td>
                                                <td><div class="cell-content">${table.size}</div></td>
                                                <td><div class="cell-content">${table.estimated_rows?.toLocaleString() || '0'}</div></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            async showTableStructure() {
                if (!this.currentTable) return;

                try {
                    const response = await fetch(`/api/admin/tables/${this.currentTable}/structure`);
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        this.renderTableStructure(data.data);
                    } else {
                        throw new Error(data.message);
                    }
                } catch (error) {
                    this.showError('Failed to load table structure: ' + error.message);
                }
            }

            renderTableStructure(data) {
                const content = document.getElementById('content');
                const structure = data.structure || [];
                const indexes = data.indexes || [];

                content.innerHTML = `
                    <div class="content-header">
                        <div class="content-title">${this.currentTable} - Structure</div>
                        <div class="content-subtitle">Table schema and indexes</div>
                    </div>
                    <div class="content-body">
                        <div class="table-container">
                            <div class="table-toolbar">
                                <div class="table-info">
                                    <div class="info-item">
                                        <i class="fas fa-columns"></i>
                                        ${structure.length} columns
                                    </div>
                                    <div class="info-item">
                                        <i class="fas fa-key"></i>
                                        ${indexes.length} indexes
                                    </div>
                                </div>
                                <div class="table-actions">
                                    <button class="btn btn-secondary btn-sm" onclick="adminPanel.fetchTableData()">
                                        <i class="fas fa-arrow-left"></i>
                                        Back to Data
                                    </button>
                                </div>
                            </div>
                            <div class="table-content">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Column</th>
                                            <th>Type</th>
                                            <th>Nullable</th>
                                            <th>Default</th>
                                            <th>Description</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${structure.map(col => `
                                            <tr>
                                                <td><div class="cell-content"><strong>${col.column_name}</strong></div></td>
                                                <td><div class="cell-content">${col.data_type}</div></td>
                                                <td><div class="cell-content">
                                                    <span class="cell-boolean ${col.is_nullable === 'YES' ? 'true' : 'false'}">
                                                        ${col.is_nullable === 'YES' ? '✓' : '✗'} ${col.is_nullable === 'YES' ? 'Yes' : 'No'}
                                                    </span>
                                                </div></td>
                                                <td><div class="cell-content">${col.column_default || '-'}</div></td>
                                                <td><div class="cell-content">${col.description || '-'}</div></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        ${indexes.length > 0 ? `
                            <div class="table-container" style="margin-top: 1.5rem;">
                                <div class="table-toolbar">
                                    <div class="table-info">
                                        <div class="info-item">
                                            <i class="fas fa-key"></i>
                                            Indexes
                                        </div>
                                    </div>
                                </div>
                                <div class="table-content">
                                    <table class="data-table">
                                        <thead>
                                            <tr>
                                                <th>Index Name</th>
                                                <th>Type</th>
                                                <th>Definition</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${indexes.map(idx => `
                                                <tr>
                                                    <td><div class="cell-content"><strong>${idx.indexname}</strong></div></td>
                                                    <td><div class="cell-content">
                                                        ${idx.indisprimary ? 'Primary Key' : idx.indisunique ? 'Unique' : 'Index'}
                                                    </div></td>
                                                    <td><div class="cell-content">${idx.indexdef}</div></td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            async refreshAll() {
                await this.loadOverview();
                await this.loadTables();
                if (this.currentTable) {
                    await this.fetchTableData();
                } else {
                    this.showOverview();
                }
            }

            showLoading() {
                document.getElementById('content').innerHTML = `
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div>Loading data...</div>
                    </div>
                `;
            }

            showError(message) {
                document.getElementById('content').innerHTML = `
                    <div class="error-container">
                        <strong>Error:</strong> ${message}
                    </div>
                `;
            }
        }

        // Initialize the admin panel
        const adminPanel = new DatabaseAdminPanel();
    </script>
</body>
</html>

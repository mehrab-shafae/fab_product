
services:
  product_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product_service
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app:cached
      - /app/node_modules
    networks:
      - krakend-private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpu_shares: 512

networks:
  krakend-private:
    external: true


services:
  fab_product:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fab_product
    restart: unless-stopped
    volumes:
      # - .:/app:cached
      - /app/node_modules
      - /var/log/app:/app/logs
    networks:
      - krakend-private

networks:
  krakend-private:
    external: true

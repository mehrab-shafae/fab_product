  /categories:
    post:
      summary: Create a new category
      tags: [Categories]
      description: |
        Create a new category in the system with enhanced features
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Category name
                parent_id:
                  type: integer
                  description: Parent category ID
                description:
                  type: string
                  description: Category description
                status:
                  type: string
                  enum: [active, inactive, draft, archived]
                  default: draft
                  description: Category status
                is_featured:
                  type: boolean
                  default: false
                  description: Whether the category is featured
                order:
                  type: integer
                  description: Display order
                image_ids:
                  type: array
                  items:
                    type: string
                  description: Array of image hash IDs
                meta_title:
                  type: string
                  description: SEO meta title
                meta_description:
                  type: string
                  description: SEO meta description
                meta_keywords:
                  type: string
                  description: SEO meta keywords
                attributes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [string, number, enum]
                      required:
                        type: boolean
                      order:
                        type: integer
                      options:
                        type: array
                        items:
                          type: string
            example:
              name: "Smartphones"
              parent_id: 1
              description: "Latest smartphone models"
              status: "draft"
              is_featured: true
              order: 1
              image_ids: ["hashid123456"]
              meta_title: "Smartphones - Latest Models"
              meta_description: "Discover the latest smartphone models"
              attributes:
                - name: "Brand"
                  type: "enum"
                  required: true
                  options: ["Apple", "Samsung", "Google"]
                - name: "Storage"
                  type: "enum"
                  required: true
                  options: ["64GB", "128GB", "256GB", "512GB"]
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Category name or slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Get all categories
      tags: [Categories]
      description: |
        Get a list of all categories in the system with enhanced filtering
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, draft, archived, pending_approval]
          description: Filter by category status
        - in: query
          name: includeInactive
          schema:
            type: boolean
            default: false
          description: Include inactive categories
        - in: query
          name: includeDraft
          schema:
            type: boolean
            default: false
          description: Include draft categories
        - in: query
          name: featured
          schema:
            type: boolean
          description: Filter by featured status
        - in: query
          name: parent_id
          schema:
            type: integer
          description: Filter by parent category ID
        - in: query
          name: level
          schema:
            type: integer
          description: Filter by category level
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: sort
          schema:
            type: string
            enum: [name_asc, name_desc, order_asc, order_desc, created_asc, created_desc]
            default: order_asc
          description: Sort order
      responses:
        '200':

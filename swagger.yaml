        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, draft, archived, pending_approval]
          description: Filter by category status
        - in: query
          name: level
          schema:
            type: integer
          description: Filter by category level
        - in: query
          name: is_featured
          schema:
            type: boolean
          description: Filter by featured status
        - in: query
          name: created_after
          schema:
            type: string
            format: date
          description: Filter by creation date (after)
        - in: query
          name: created_before
          schema:
            type: string
            format: date
          description: Filter by creation date (before)
        - in: query
          name: page

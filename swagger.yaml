      tags: [Products]
      description: |
        Update multiple products simultaneously with various update types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - data
              properties:
                type:
                  type: string
                  enum: [update, price_update, inventory_update]
                  description: Update type
                data:
                  type: array
                  items:
                    type: object
                  description: Update data
                options:
                  type: object
                  properties:
                    batchSize:
                      type: integer
                    concurrency:
                      type: integer
                    retryAttempts:
                      type: integer
                    retryDelay:
                      type: integer
            example:
              type: "price_update"
              data:
                - id: 1
                  price: 899.99
                - id: 2
                  price: 749.99
              options:
                batchSize: 100
                concurrency: 5
                retryAttempts: 3
                retryDelay: 1000
      responses:
        '200':
          description: Operation queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  jobIds:
                    type: array
                    items:
                      type: string
              example:
                message: "Bulk update operation queued successfully"
                jobIds: ["job-123", "job-124"]
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


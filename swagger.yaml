            schema:
              type: object
              required:
                - format
                - data
              properties:
                format:
                  type: string
                  enum: [csv, json, xml]
                  description: Import format
                data:
                  type: string
                  description: Import data
                options:
                  type: object
                  properties:
                    updateExisting:
                      type: boolean
                      default: false
                    skipDuplicates:
                      type: boolean
                      default: true
            example:
              format: "json"

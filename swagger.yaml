openapi: 3.0.0
info:
  title: Product Microservice API
  version: 1.0.0
  description: API for managing products and related features

servers:
  - url: http://localhost:5003/api/product/v1
    description: Product API endpoints
  - url: http://localhost:5003
    description: System endpoints

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          description: Product ID
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price:
          type: number
          description: Product price
        category_id:
          type: integer
          description: Category ID
        metadata:
          type: object
          description: Additional product metadata
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    Category:
      type: object
      properties:
        id:
          type: integer
          description: Category ID
        name:
          type: string
          description: Category name
        slug:
          type: string
          description: Category slug
        parent_id:
          type: integer
          description: Parent category ID
        status:
          type: string
          enum: [active, inactive]
          description: Category status
        is_featured:
          type: boolean
          description: Whether the category is featured
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: Child categories
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    Review:
      type: object
      properties:
        id:
          type: integer
          description: The review ID
        product_id:
          type: integer
          description: The product ID
        user_id:
          type: string
          description: The user hash ID
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The review rating (1-5)
        content:
          type: string
          description: The review text
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
      required:
        - product_id
        - user_id
        - rating
        - content

    Comment:
      type: object
      properties:
        id:
          type: integer
          description: Comment ID
        product_id:
          type: integer
          description: Product ID
        user_id:
          type: string
          description: User hash ID
        content:
          type: string
          description: Comment content
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - product_id
        - user_id
        - content

    Chat:
      type: object
      properties:
        id:
          type: string
          description: Chat ID
        product_id:
          type: integer
          description: Product ID
        user_id:
          type: string
          description: User hash ID
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          description: Message ID
        chat_id:
          type: string
          description: Chat ID
        user_id:
          type: string
          description: User hash ID
        content:
          type: string
          description: Message content
        is_read:
          type: boolean
          description: Whether the message has been read
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - chat_id
        - user_id
        - content

    Wishlist:
      type: object
      properties:
        id:
          type: integer
          description: The wishlist item ID
        user_id:
          type: string
          description: The user hash ID
        product_id:
          type: integer
          description: The product ID
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
      required:
        - user_id
        - product_id

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code
        details:
          type: object
          description: Additional error details

    ProductAnalytics:
      type: object
      properties:
        views:
          type: integer
          description: Number of views
        unique_viewers:
          type: integer
          description: Number of unique viewers
        avg_price:
          type: number
          description: Average price
        min_price:
          type: number
          description: Minimum price
        max_price:
          type: number
          description: Maximum price
        review_count:
          type: integer
          description: Number of reviews
        avg_rating:
          type: number
          description: Average rating

    CategoryAnalytics:
      type: object
      properties:
        product_count:
          type: integer
          description: Number of products
        avg_price:
          type: number
          description: Average price
        min_price:
          type: number
          description: Minimum price
        max_price:
          type: number
          description: Maximum price
        review_count:
          type: integer
          description: Number of reviews
        avg_rating:
          type: number
          description: Average rating

    ProductAttribute:
      type: object
      properties:
        attribute_id:
          type: integer
          description: Attribute ID
        name:
          type: string
          description: Attribute name
        value:
          type: string
          description: Attribute value

    PriceHistory:
      type: object
      properties:
        id:
          type: integer
          description: Price history entry ID
        product_id:
          type: integer
          description: Product ID
        variant_id:
          type: integer
          description: Variant ID
        price:
          type: number
          description: Price value
        created_at:
          type: string
          format: date-time
          description: Creation timestamp

    PriceStatistics:
      type: object
      properties:
        avg_price:
          type: number
          description: Average price
        min_price:
          type: number
          description: Minimum price
        max_price:
          type: number
          description: Maximum price
        price_history:
          type: array
          items:
            $ref: '#/components/schemas/PriceHistory'

    ProductVariant:
      type: object
      properties:
        id:
          type: integer
          description: Variant ID
        product_id:
          type: integer
          description: Product ID
        name:
          type: string
          description: Variant name
        price:
          type: number
          description: Variant price
        sku:
          type: string
          description: Stock keeping unit
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    ProductImage:
      type: object
      properties:
        id:
          type: integer
          description: Image ID
        product_id:
          type: integer
          description: Product ID
        url:
          type: string
          description: Image URL
        alt_text:
          type: string
          description: Image alt text
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    ProductReview:
      type: object
      properties:
        id:
          type: integer
          description: Review ID
        product_id:
          type: integer
          description: Product ID
        user_id:
          type: string
          description: User hash ID
        rating:
          type: number
          description: Review rating
        content:
          type: string
          description: Review content
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    Attribute:
      type: object
      properties:
        id:
          type: integer
          description: Attribute ID
        name:
          type: string
          description: Attribute name
        type:
          type: string
          description: Attribute type
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    PriceTrends:
      type: object
      properties:
        period:
          type: string
          description: Time period
        trends:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Date
              price:
                type: number
                description: Price value

    ProductRelationship:
      type: object
      properties:
        id:
          type: integer
          description: Relationship ID
        product_id:
          type: integer
          description: Product ID
        related_product_id:
          type: integer
          description: Related product ID
        relationship_type:
          type: string
          description: Relationship type
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    ProductVersion:
      type: object
      properties:
        id:
          type: integer
          description: Version ID
        product_id:
          type: integer
          description: Product ID
        version_number:
          type: string
          description: Version number
        changes:
          type: object
          description: Version changes
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          description: Array of items
        pagination:
          type: object
          properties:
            page:
              type: integer
              description: Current page number
            limit:
              type: integer
              description: Number of items per page
            total:
              type: integer
              description: Total number of items
            pages:
              type: integer
              description: Total number of pages

    CategoryAttribute:
      type: object
      properties:
        id:
          type: integer
          description: Attribute ID
        category_id:
          type: integer
          description: Category ID
        name:
          type: string
          description: Attribute name
        type:
          type: string
          enum: [text, number, select, multiselect]
          description: Attribute type
        required:
          type: boolean
          description: Whether the attribute is required
        order:
          type: integer
          description: Display order
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryAttributeOption:
      type: object
      properties:
        id:
          type: integer
          description: Option ID
        attribute_id:
          type: integer
          description: Attribute ID
        value:
          type: string
          description: Option value
        order:
          type: integer
          description: Display order
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Check system health
      tags: [System]
      description: |
        Check the health status of the system and its dependencies
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                    description: System status
                  timestamp:
                    type: string
                    format: date-time
                    description: Current timestamp
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        description: Database connection status
                      cache:
                        type: string
                        description: Cache service status
                  version:
                    type: string
                    description: API version

  /flush:
    post:
      summary: Flush system cache
      tags: [System]
      description: |
        Flush all cached data from the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patterns:
                  type: array
                  items:
                    type: string
                  description: Cache patterns to flush
                type:
                  type: string
                  enum: [products, categories, all]
                  description: Type of cache to flush
      responses:
        '200':
          description: Cache flushed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  patterns:
                    type: array
                    items:
                      type: string
                    description: Patterns that were flushed
                  type:
                    type: string
                    description: Type of cache that was flushed

  /jobs/{jobId}/status:
    get:
      summary: Get job status
      tags: [System]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Job ID
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, processing, completed, failed]
                    description: Job status
                  progress:
                    type: number
                    description: Job progress percentage
                  result:
                    type: object
                    description: Job result
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products:
    post:
      summary: Create a new product
      tags: [Products]
      description: |
        Create a new product in the system with detailed information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
                - description
              properties:
                name:
                  type: string
                  description: Product name
                description:
                  type: string
                  description: Product description
                price:
                  type: number
                  description: Product price
                category_id:
                  type: integer
                  description: Category ID
                metadata:
                  type: object
                  description: Additional product metadata
            example:
              name: "iPhone 13 Pro"
              description: "Latest iPhone model with advanced camera system"
              price: 999.99
              category_id: 2
              metadata:
                color: "Graphite"
                storage: "256GB"
                warranty: "1 year"
      responses:
        '200':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 1
                name: "iPhone 13 Pro"
                description: "Latest iPhone model with advanced camera system"
                price: 999.99
                category_id: 2
                metadata:
                  color: "Graphite"
                  storage: "256GB"
                  warranty: "1 year"
                created_at: "2024-03-20T10:00:00Z"
                updated_at: "2024-03-20T10:00:00Z"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    get:
      summary: Get a paginated list of products
      tags: [Products]
      description: |
        Get a paginated list of products with optional filters
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter by category ID
        - in: query
          name: min_price
          schema:
            type: number
          description: Minimum price filter
        - in: query
          name: max_price
          schema:
            type: number
          description: Maximum price filter
        - in: query
          name: sort
          schema:
            type: string
            enum: [price_asc, price_desc, name_asc, name_desc, newest]
          description: Sort order
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
              example:
                data:
                  - id: 1
                    name: "iPhone 13 Pro"
                    description: "Latest iPhone model"
                    price: 999.99
                    category_id: 2
                    created_at: "2024-03-20T10:00:00Z"
                  - id: 2
                    name: "Samsung Galaxy S21"
                    description: "Latest Samsung flagship"
                    price: 799.99
                    category_id: 2
                    created_at: "2024-03-20T09:00:00Z"
                pagination:
                  page: 1
                  limit: 10
                  total: 50
                  pages: 5
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{id}:
    get:
      summary: Get product by ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update product
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
                - description
              properties:
                name:
                  type: string
                  description: Product name
                price:
                  type: number
                  description: Product price
                description:
                  type: string
                  description: Product description
                category_id:
                  type: integer
                  description: Category ID
                metadata:
                  type: object
                  description: Additional product metadata
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete product
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        '200':
          description: Product deleted successfully
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/bulk-update:
    post:
      summary: Bulk update products
      tags: [Products]
      description: |
        Update multiple products simultaneously with various update types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - data
              properties:
                type:
                  type: string
                  enum: [update, price_update, inventory_update]
                  description: Update type
                data:
                  type: array
                  items:
                    type: object
                  description: Update data
                options:
                  type: object
                  properties:
                    batchSize:
                      type: integer
                    concurrency:
                      type: integer
                    retryAttempts:
                      type: integer
                    retryDelay:
                      type: integer
            example:
              type: "price_update"
              data:
                - id: 1
                  price: 899.99
                - id: 2
                  price: 749.99
              options:
                batchSize: 100
                concurrency: 5
                retryAttempts: 3
                retryDelay: 1000
      responses:
        '200':
          description: Operation queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  jobIds:
                    type: array
                    items:
                      type: string
              example:
                message: "Bulk update operation queued successfully"
                jobIds: ["job-123", "job-124"]
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/search/document:
    get:
      summary: Search product documents
      tags: [Products]
      description: |
        Search products using full-text search with various filters
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search query
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter by category
        - in: query
          name: min_price
          schema:
            type: number
          description: Minimum price
        - in: query
          name: max_price
          schema:
            type: number
          description: Maximum price
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productId}/price-trends:
    get:
      summary: Get product price trends
      tags: [Products]
      description: |
        Get historical price trends for a product with optional variant filtering
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
          description: Product ID
        - in: query
          name: variant_id
          schema:
            type: integer
          description: Variant ID
        - in: query
          name: period
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: "30d"
          description: Time period for trends
      responses:
        '200':
          description: Price trends data
          content:
            application/json:
              schema:
                type: object
                properties:
                  trends:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        price:
                          type: number
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productId}/price-history:
    post:
      summary: Add price history
      tags: [Products]
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - price
                - variant_id
              properties:
                price:
                  type: number
                  description: Product price
                variant_id:
                  type: integer
                  description: Variant ID
      responses:
        '200':
          description: Price history added successfully
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productId}/relationships:
    post:
      summary: Add product relationship
      tags: [Products]
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - related_product_id
                - relationship_type
              properties:
                related_product_id:
                  type: integer
                  description: Related product ID
                relationship_type:
                  type: string
                  description: Relationship type
      responses:
        '200':
          description: Relationship added successfully
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Get product relationships
      tags: [Products]
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        '200':
          description: Product relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    related_product_id:
                      type: integer
                    relationship_type:
                      type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productId}/versions:
    post:
      summary: Create product version
      tags: [Products]
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version_number
                - changes
              properties:
                version_number:
                  type: integer
                  description: Version number
                changes:
                  type: object
                  description: Version changes
      responses:

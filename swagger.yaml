  /categories/{categoryId}/redirects:
    post:
      summary: Add slug redirect
      tags: [Categories]
      description: |
        Add an old slug redirect for a category to maintain SEO when slug changes
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: integer
          description: Category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldSlug
              properties:
                oldSlug:
                  type: string
                  description: The old slug to redirect from
                  minLength: 3
                  maxLength: 100
                  pattern: '^[a-z0-9\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF-]+$'
            example:
              oldSlug: "old-category-slug"
      responses:
        '200':
          description: Redirect added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    $ref: '#/components/schemas/Category'
                  message:
                    type: string
                    example: "Redirect با موفقیت اضافه شد"
        '400':
          description: Invalid old slug format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':

      summary: Bulk delete categories
      tags: [Categories]
      description: |
        Delete multiple categories simultaneously
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryIds
              properties:
                categoryIds:
                  type: array
                  items:
                    type: integer
                  description: Array of category IDs to delete
            example:
              categoryIds: [1, 2, 3]
      responses:
        '200':
          description: Categories deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of categories
                  success:
                    type: integer
                    description: Number of successfully deleted categories

    put:
      summary: Bulk update categories
      tags: [Categories]
      description: |
        Update multiple categories simultaneously
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categories
              properties:
                categories:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Category ID
                      name:
                        type: string
                      description:
                        type: string
                      status:
                        type: string
                        enum: [active, inactive, draft, archived]
                      is_featured:
                        type: boolean
                      order:
                        type: integer
            example:
              categories:
                - id: 1
                  name: "Updated Electronics"
                  status: "active"
                - id: 2
                  name: "Updated Smartphones"
                  status: "inactive"
      responses:
        '200':
          description: Categories updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'


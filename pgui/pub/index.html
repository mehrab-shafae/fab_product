                        async renderOverviewErd() {
                              const loading = document.getElementById('overviewErdLoading');
                              const error = document.getElementById('overviewErdError');
                              const graph = document.getElementById('overviewErdGraph');
                              console.log('renderOverviewErd called', { loading, error, graph, db: this.currentDatabase });
                              if (graph) graph.innerHTML = '<div style="color:#f59e0b;text-align:center;padding:1rem;">[ERD Graph Container Ready]</div>';
                              if (!this.currentDatabase || !loading || !error || !graph) return;
                              loading.style.display = 'block';
                              error.style.display = 'none';
                              graph.innerHTML = '';
                              try {
                                    // Fetch all tables
                                    const tablesRes = await fetch(`http://localhost:7002/tables?database=${encodeURIComponent(this.currentDatabase)}`);
                                    const tablesData = await tablesRes.json();
                                    if (!tablesData.status || tablesData.status !== 'success') throw new Error('Failed to load tables');
                                    const tables = tablesData.data;
                                    if (!tables || !tables.length) {
                                          loading.style.display = 'none';
                                          graph.innerHTML = '<div style="color:#ef4444;text-align:center;padding:2rem;">هیچ جدولی برای نمایش وجود ندارد.</div>';
                                          return;
                                    }
                                    // Fetch all relationships for all tables
                                    const rels = [];
                                    for (const table of tables) {
                                          const relRes = await fetch(`http://localhost:7002/tables/${table.name}/relationships?database=${encodeURIComponent(this.currentDatabase)}`);
                                          const relData = await relRes.json();
                                          if (relData.status === 'success' && relData.data && Array.isArray(relData.data.relationships)) {
                                                rels.push(...relData.data.relationships);
                                          }
                                    }
                                    // Build Cytoscape elements
                                    const nodes = tables.map(t => ({ data: { id: t.name, label: t.name } }));
                                    const edges = rels.map(r => ({ data: { source: r.table_name, target: r.foreign_table_name, label: r.column_name + ' → ' + r.foreign_column_name } }));
                                    loading.style.display = 'none';
                                    if (!window.cytoscape) {
                                          graph.innerHTML = '<div style="color:#ef4444;text-align:center;padding:2rem;">Cytoscape.js بارگذاری نشد!</div>';
                                          return;
                                    }
                                    if (!nodes.length) {
                                          graph.innerHTML = '<div style="color:#ef4444;text-align:center;padding:2rem;">هیچ نودی برای نمایش وجود ندارد.</div>';
                                          return;
                                    }
                                    // Render graph
                                    const cy = cytoscape({
                                          container: graph,
                                          elements: { nodes, edges },
                                          style: [
                                                {
                                                      selector: 'node',
                                                      style: {
                                                            'background-color': '#6366f1',
                                                            label: 'data(label)',
                                                            color: '#fff',
                                                            'text-valign': 'center',
                                                            'text-halign': 'center',
                                                            'font-size': '28px',
                                                            width: 110,
                                                            height: 110,
                                                            'border-width': 3,
                                                            'border-color': '#4f46e5',
                                                            'text-outline-width': 4,
                                                            'text-outline-color': '#6366f1',
                                                            'text-wrap': 'wrap',
                                                            'text-max-width': 120,
                                                      },
                                                },
                                                {
                                                      selector: 'edge',
                                                      style: {
                                                            width: 4,
                                                            'line-color': '#a5b4fc',
                                                            'target-arrow-color': '#a5b4fc',
                                                            'target-arrow-shape': 'triangle',
                                                            'curve-style': 'bezier',
                                                            label: 'data(label)',
                                                            'font-size': '18px',
                                                            color: '#64748b',
                                                            'text-background-color': '#fff',
                                                            'text-background-opacity': 1,
                                                            'text-background-padding': 3,
                                                      },
                                                },
                                                {
                                                      selector: ':selected',
                                                      style: {
                                                            'background-color': '#10b981',
                                                            'line-color': '#10b981',
                                                            'target-arrow-color': '#10b981',
                                                            'source-arrow-color': '#10b981',
                                                      },
                                                },
                                          ],
                                          layout: {
                                                name: nodes.length > 20 ? 'breadthfirst' : 'cose',
                                                animate: true,
                                                fit: true,
                                                padding: 80,
                                                spacingFactor: 1.5,
                                                nodeRepulsion: 12000,
                                                idealEdgeLength: 200,
                                          },
                                          minZoom: 0.3,
                                          maxZoom: 2,
                                          wheelSensitivity: 0.2,
                                    });
                                    cy.fit();
                              } catch (err) {
                                    loading.style.display = 'none';
                                    error.style.display = 'block';
                                    error.innerText = 'خطا در بارگذاری نمودار: ' + (err.message || err);
                              }
                        }

                                                  .join('')}

                        `
                                    : ''

                    </div>
                `;
                        }

                        async refreshAll() {

                        showToast(message, type = 'info') {
                              const toastContainer = document.getElementById('toastContainer');
                              const toast = document.createElement('div');
                              toast.className = `toast fade-in ${type}`;
                              toast.style = `background:${type === 'error' ? '#ef4444' : '#10b981'};color:#fff;padding:1rem 1.5rem;border-radius:0.5rem;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:0.75rem;min-width:220px;display:flex;align-items:center;gap:0.75rem;font-weight:600;`;
                              toast.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-triangle' : 'check-circle'}"></i> ${message} <span style='flex:1'></span><button style='background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;' onclick='this.parentNode.remove()'>&times;</button>`;
                              toastContainer.appendChild(toast);
                              setTimeout(() => {
                                    toast.remove();
                              }, 6000);

                        async exportTable(format) {

                                          const url = window.URL.createObjectURL(blob);
                                          const a = document.createElement('a');
                                          a.href = url;
                                          a.download = `${this.currentTable}.${format}`;
                                          document.body.appendChild(a);
                                          a.click();
                                          a.remove();
                                    });
                        }

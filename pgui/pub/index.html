<!doctype html>
<html lang="en">
      <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Database Admin Panel - Read Only</title>
            <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
            <style>
                  :root {
                        --primary-color: #6366f1;
                        --primary-hover: #4f46e5;
                        --secondary-color: #64748b;
                        --success-color: #10b981;
                        --warning-color: #f59e0b;
                        --danger-color: #ef4444;
                        --info-color: #3b82f6;
                        --bg-primary: #ffffff;
                        --bg-secondary: #f8fafc;
                        --bg-tertiary: #f1f5f9;
                        --text-primary: #1e293b;
                        --text-secondary: #64748b;
                        --text-muted: #94a3b8;
                        --border-color: #e2e8f0;
                        --border-hover: #cbd5e1;
                        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
                        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
                        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
                        --radius-sm: 0.375rem;
                        --radius-md: 0.5rem;
                        --radius-lg: 0.75rem;
                  }

                  * {
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                  }

                  body {
                        font-family:
                              'Inter',
                              -apple-system,
                              BlinkMacSystemFont,
                              'Segoe UI',
                              Roboto,
                              'Helvetica Neue',
                              Arial,
                              sans-serif;
                        background: var(--bg-secondary);
                        color: var(--text-primary);
                        line-height: 1.6;
                        overflow-x: hidden;
                        font-size: 14px;
                  }

                  /* Header */
                  .header {
                        background: var(--bg-primary);
                        border-bottom: 1px solid var(--border-color);
                        padding: 1rem 1.5rem;
                        position: sticky;
                        top: 0;
                        z-index: 100;
                        box-shadow: var(--shadow-sm);
                  }

                  .header-content {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        max-width: 1400px;
                        margin: 0 auto;
                  }

                  .header-left {
                        display: flex;
                        align-items: center;
                        gap: 1rem;
                  }

                  .header-title {
                        font-size: 1.5rem;
                        font-weight: 700;
                        color: var(--text-primary);
                        display: flex;
                        align-items: center;
                        gap: 0.5rem;
                        letter-spacing: -0.025em;
                  }

                  .header-badge {
                        background: var(--success-color);
                        color: white;
                        padding: 0.25rem 0.75rem;
                        border-radius: var(--radius-sm);
                        font-size: 0.75rem;
                        font-weight: 600;
                        text-transform: uppercase;
                        letter-spacing: 0.05em;
                  }

                  .header-actions {
                        display: flex;
                        gap: 0.5rem;
                  }

                  .btn {
                        padding: 0.5rem 1rem;
                        border: none;
                        border-radius: var(--radius-md);
                        font-size: 0.875rem;
                        font-weight: 600;
                        cursor: pointer;
                        transition: all 0.2s ease;
                        display: inline-flex;
                        align-items: center;
                        gap: 0.5rem;
                        text-decoration: none;
                        font-family: inherit;
                  }

                  .btn-primary {
                        background: var(--primary-color);
                        color: white;
                  }

                  .btn-primary:hover {
                        background: var(--primary-hover);
                        transform: translateY(-1px);
                        box-shadow: var(--shadow-md);
                  }

                  .btn-secondary {
                        background: var(--bg-tertiary);
                        color: var(--text-secondary);
                        border: 1px solid var(--border-color);
                  }

                  .btn-secondary:hover {
                        background: var(--border-hover);
                        transform: translateY(-1px);
                        box-shadow: var(--shadow-sm);
                  }

                  .btn-sm {
                        padding: 0.375rem 0.75rem;
                        font-size: 0.75rem;
                  }

                  /* Main Layout */
                  .main-container {
                        display: flex;
                        height: calc(100vh - 80px);
                        max-width: 1400px;
                        margin: 0 auto;
                  }

                  /* Sidebar */
                  .sidebar {
                        width: 320px;
                        background: var(--bg-primary);
                        border-right: 1px solid var(--border-color);
                        display: flex;
                        flex-direction: column;
                        overflow: hidden;
                  }

                  .sidebar-header {
                        padding: 1rem;
                        border-bottom: 1px solid var(--border-color);
                        background: var(--bg-secondary);
                  }

                  .search-container {
                        position: relative;
                  }

                  .search-input {
                        width: 100%;
                        padding: 0.75rem 1rem 0.75rem 2.5rem;
                        border: 1px solid var(--border-color);
                        border-radius: var(--radius-md);
                        font-size: 0.875rem;
                        background: var(--bg-primary);
                        transition: all 0.2s ease;
                        font-family: inherit;
                  }

                  .search-input:focus {
                        outline: none;
                        border-color: var(--primary-color);
                        box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
                  }

                  .search-icon {
                        position: absolute;
                        left: 0.75rem;
                        top: 50%;
                        transform: translateY(-50%);
                        color: var(--text-muted);
                  }

                  .sidebar-content {
                        flex: 1;
                        overflow-y: auto;
                        padding: 0.5rem;
                  }

                  .table-list {
                        list-style: none;
                  }

                  .table-item {
                        padding: 0.75rem 1rem;
                        border-radius: var(--radius-md);
                        cursor: pointer;
                        transition: all 0.2s ease;
                        margin-bottom: 0.25rem;
                        border: 1px solid transparent;
                  }

                  .table-item:hover {
                        background: var(--bg-secondary);
                        border-color: var(--border-color);
                        transform: translateX(2px);
                  }

                  .table-item.active {
                        background: var(--primary-color);
                        color: white;
                        border-color: var(--primary-color);
                        box-shadow: var(--shadow-sm);
                  }

                  .table-item.active .table-name {
                        color: white;
                  }

                  .table-item.active .table-count {
                        color: rgba(255, 255, 255, 0.8);
                  }

                  .table-name {
                        font-weight: 600;
                        color: var(--text-primary);
                        margin-bottom: 0.25rem;
                        display: flex;
                        align-items: center;
                        gap: 0.5rem;
                        font-size: 0.875rem;
                  }

                  .table-icon {
                        font-size: 0.875rem;
                        opacity: 0.7;
                  }

                  .table-count {
                        font-size: 0.75rem;
                        color: var(--text-secondary);
                        display: flex;
                        align-items: center;
                        gap: 0.25rem;
                        font-weight: 500;
                  }

                  .table-size {
                        font-size: 0.75rem;
                        color: var(--text-muted);
                        margin-top: 0.25rem;
                        font-weight: 500;
                  }

                  /* Main Content */
                  .main-content {
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        overflow-y: auto;
                        min-height: 0;
                        max-height: none;
                  }

                  .content-header {
                        padding: 1.5rem;
                        background: var(--bg-primary);
                        border-bottom: 1px solid var(--border-color);
                  }

                  .content-title {
                        font-size: 1.75rem;
                        font-weight: 700;
                        color: var(--text-primary);
                        margin-bottom: 0.5rem;
                        letter-spacing: -0.025em;
                  }

                  .content-subtitle {
                        color: var(--text-secondary);
                        font-size: 0.875rem;
                        font-weight: 500;
                  }

                  .content-body {
                        flex: 1;
                        padding: 1.5rem;
                        overflow-y: auto;
                        background: var(--bg-secondary);
                        min-height: 0;
                        max-height: none;
                  }

                  /* Dashboard */
                  .dashboard {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                        gap: 1.5rem;
                        margin-bottom: 2rem;
                  }

                  .stat-card {
                        background: var(--bg-primary);
                        border: 1px solid var(--border-color);
                        border-radius: var(--radius-lg);
                        padding: 1.5rem;
                        box-shadow: var(--shadow-sm);
                        transition: all 0.2s ease;
                  }

                  .stat-card:hover {
                        box-shadow: var(--shadow-md);
                        transform: translateY(-2px);
                  }

                  .stat-header {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 1rem;
                  }

                  .stat-title {
                        font-size: 0.875rem;
                        font-weight: 600;
                        color: var(--text-secondary);
                        text-transform: uppercase;
                        letter-spacing: 0.05em;
                  }

                  .stat-icon {
                        width: 2.5rem;
                        height: 2.5rem;
                        border-radius: var(--radius-md);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 1.25rem;
                  }

                  .stat-icon.blue {
                        background: rgb(59 130 246 / 0.1);
                        color: var(--info-color);
                  }

                  .stat-icon.green {
                        background: rgb(16 185 129 / 0.1);
                        color: var(--success-color);
                  }

                  .stat-icon.orange {
                        background: rgb(245 158 11 / 0.1);
                        color: var(--warning-color);
                  }

                  .stat-icon.purple {
                        background: rgb(99 102 241 / 0.1);
                        color: var(--primary-color);
                  }

                  .stat-value {
                        font-size: 2.25rem;
                        font-weight: 800;
                        color: var(--text-primary);
                        margin-bottom: 0.25rem;
                        letter-spacing: -0.025em;
                  }

                  .stat-change {
                        font-size: 0.875rem;
                        color: var(--text-secondary);
                        font-weight: 500;
                  }

                  /* Table View */
                  .table-container {
                        background: var(--bg-primary) !important;
                        border-radius: var(--radius-lg);
                        overflow: hidden;
                        box-shadow: var(--shadow-sm);
                        margin-bottom: 2rem;
                        display: flex;
                        flex-direction: column;
                  }

                  .table-toolbar {
                        padding: 1rem 1.5rem;
                        background: var(--bg-secondary);
                        border-bottom: 1px solid var(--border-color);
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        flex-wrap: wrap;
                        gap: 1rem;
                        flex-shrink: 0;
                        box-shadow: none;
                  }

                  .table-info {
                        display: flex;
                        align-items: center;
                        gap: 1rem;
                        flex-wrap: wrap;
                  }

                  .info-item {
                        display: flex;
                        align-items: center;
                        gap: 0.5rem;
                        font-size: 0.875rem;
                        color: var(--text-secondary);
                        font-weight: 500;
                  }

                  .table-actions {
                        display: flex;
                        gap: 0.5rem;
                  }

                  .table-content {
                        flex: 1;
                        overflow: auto !important;
                        min-height: 120px;
                        max-height: 70vh;
                        position: relative;
                        background: #f1f5f9 !important;
                        box-shadow: none;
                  }

                  .data-table {
                        width: 100%;
                        border-collapse: collapse;
                        font-size: 0.875rem;
                        table-layout: auto;
                        box-shadow: none;
                  }

                  .data-table th {
                        background: var(--bg-secondary);
                        padding: 1rem 0.75rem;
                        text-align: left;
                        font-weight: 700;
                        color: var(--text-primary);
                        border-bottom: 2px solid var(--border-color);
                        position: sticky;
                        top: 0;
                        z-index: 10;
                        font-size: 0.75rem;
                        text-transform: uppercase;
                        letter-spacing: 0.05em;
                        white-space: normal;
                        word-wrap: break-word;
                        min-width: 120px;
                        max-width: 200px;
                  }

                  .data-table td {
                        padding: 1rem 0.75rem;
                        border-bottom: 1px solid var(--border-color);
                        font-size: 0.875rem;
                        vertical-align: top;
                        line-height: 1.5;
                        word-wrap: break-word;
                        min-width: 120px;
                        max-width: 200px;
                  }

                  .data-table tr:hover {
                        background: var(--bg-secondary);
                  }

                  .data-table tr:last-child td {
                        border-bottom: none;
                  }

                  /* Data Display */
                  .cell-content {
                        max-width: 300px;
                        word-break: break-word;
                        line-height: 1.5;
                        font-size: 0.875rem;
                  }

                  .cell-null {
                        color: var(--text-muted);
                        font-style: italic;
                        font-weight: 500;
                        background: var(--bg-tertiary);
                        padding: 0.25rem 0.5rem;
                        border-radius: var(--radius-sm);
                        display: inline-block;
                  }

                  .cell-boolean {
                        display: inline-flex;
                        align-items: center;
                        gap: 0.25rem;
                        padding: 0.25rem 0.75rem;
                        border-radius: var(--radius-sm);
                        font-size: 0.75rem;
                        font-weight: 700;
                        text-transform: uppercase;
                        letter-spacing: 0.05em;
                  }

                  .cell-boolean.true {
                        background: rgb(16 185 129 / 0.1);
                        color: var(--success-color);
                  }

                  .cell-boolean.false {
                        background: rgb(239 68 68 / 0.1);
                        color: var(--danger-color);
                  }

                  .cell-number {
                        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
                        font-weight: 600;
                        color: var(--info-color);
                  }

                  .cell-date {
                        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
                        font-weight: 500;
                        color: var(--warning-color);
                        font-size: 0.8rem;
                  }

                  .cell-json {
                        background: var(--bg-tertiary);
                        padding: 0.75rem;
                        border-radius: var(--radius-sm);
                        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
                        font-size: 0.75rem;
                        white-space: pre-wrap;
                        max-height: 300px;
                        overflow-y: auto;
                        border: 1px solid var(--border-color);
                        line-height: 1.4;
                  }

                  .cell-text-long {
                        position: relative;
                  }

                  .cell-text-long .text-preview {
                        max-height: 4rem;
                        overflow: hidden;
                        position: relative;
                        line-height: 1.4;
                  }

                  .cell-text-long .text-preview::after {
                        content: '';
                        position: absolute;
                        bottom: 0;
                        right: 0;
                        width: 50px;
                        height: 1.5rem;
                        background: linear-gradient(transparent, var(--bg-primary));
                  }

                  .cell-text-long .text-full {
                        display: none;
                        position: absolute;
                        top: 100%;
                        left: 0;
                        right: 0;
                        background: var(--bg-primary);
                        border: 1px solid var(--border-color);
                        border-radius: var(--radius-sm);
                        padding: 1rem;
                        box-shadow: var(--shadow-lg);
                        z-index: 100;
                        max-width: 500px;
                        max-height: 400px;
                        overflow-y: auto;
                        font-size: 0.875rem;
                        line-height: 1.5;
                  }

                  .cell-text-long:hover .text-full {
                        display: block;
                  }

                  .cell-url {
                        color: var(--primary-color);
                        text-decoration: none;
                        word-break: break-all;
                  }

                  .cell-url:hover {
                        text-decoration: underline;
                  }

                  /* Pagination */
                  .pagination {
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        gap: 0.5rem;
                        padding: 1rem 1.5rem;
                        background: var(--bg-secondary);
                        border-top: 1px solid var(--border-color);
                  }

                  .pagination button {
                        padding: 0.5rem 0.75rem;
                        border: 1px solid var(--border-color);
                        background: var(--bg-primary);
                        color: var(--text-secondary);
                        border-radius: var(--radius-sm);
                        cursor: pointer;
                        transition: all 0.2s ease;
                        font-size: 0.875rem;
                        font-weight: 600;
                        font-family: inherit;
                  }

                  .pagination button:hover:not(:disabled) {
                        background: var(--primary-color);
                        color: white;
                        border-color: var(--primary-color);
                        transform: translateY(-1px);
                  }

                  .pagination button:disabled {
                        opacity: 0.5;
                        cursor: not-allowed;
                  }

                  .pagination-info {
                        font-size: 0.875rem;
                        color: var(--text-secondary);
                        margin: 0 1rem;
                        font-weight: 600;
                  }

                  /* Loading & Error States */
                  .loading-container {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        padding: 3rem;
                        color: var(--text-secondary);
                  }

                  .loading-spinner {
                        width: 2rem;
                        height: 2rem;
                        border: 2px solid var(--border-color);
                        border-top: 2px solid var(--primary-color);
                        border-radius: 50%;
                        animation: spin 1s linear infinite;
                        margin-bottom: 1rem;
                  }

                  @keyframes spin {
                        0% {
                              transform: rotate(0deg);
                        }
                        100% {
                              transform: rotate(360deg);
                        }
                  }

                  .error-container {
                        background: rgb(239 68 68 / 0.1);
                        border: 1px solid rgb(239 68 68 / 0.2);
                        color: var(--danger-color);
                        padding: 1rem;
                        border-radius: var(--radius-md);
                        margin: 1rem 0;
                        font-weight: 600;
                  }

                  .empty-state {
                        text-align: center;
                        padding: 3rem;
                        color: var(--text-secondary);
                  }

                  .empty-state i {
                        font-size: 3rem;
                        margin-bottom: 1rem;
                        opacity: 0.5;
                  }

                  /* Responsive Design */
                  @media (max-width: 1200px) {
                        .main-container {
                              max-width: 100%;
                        }

                        .dashboard {
                              grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                        }
                  }

                  @media (max-width: 768px) {
                        body {
                              font-size: 13px;
                        }

                        .main-container {
                              flex-direction: column;
                              height: auto;
                              min-height: calc(100vh - 80px);
                        }

                        .sidebar {
                              width: 100%;
                              height: auto;
                              max-height: 300px;
                              border-right: none;
                              border-bottom: 1px solid var(--border-color);
                        }

                        .header {
                              padding: 0.75rem 1rem;
                        }

                        .header-title {
                              font-size: 1.25rem;
                        }

                        .content-header {
                              padding: 1rem;
                        }

                        .content-title {
                              font-size: 1.5rem;
                        }

                        .content-body {
                              padding: 1rem;
                        }

                        .dashboard {
                              grid-template-columns: 1fr;
                              gap: 1rem;
                        }

                        .stat-card {
                              padding: 1rem;
                        }

                        .stat-value {
                              font-size: 1.75rem;
                        }

                        .table-container {
                              min-height: 200px;
                              max-height: none;
                        }

                        .table-content {
                              max-height: 40vh;
                        }

                        .table-toolbar {
                              flex-direction: column;
                              align-items: stretch;
                              padding: 1rem;
                        }

                        .table-info {
                              justify-content: center;
                              gap: 0.75rem;
                        }

                        .table-actions {
                              justify-content: center;
                        }

                        .data-table {
                              table-layout: auto;
                              font-size: 0.75rem;
                        }

                        .data-table th,
                        .data-table td {
                              padding: 0.75rem 0.5rem;
                              font-size: 0.75rem;
                              min-width: 80px;
                              max-width: 150px;
                        }

                        .data-table th {
                              font-size: 0.7rem;
                              letter-spacing: 0.02em;
                        }

                        .cell-content {
                              max-width: 200px;
                        }

                        .pagination {
                              flex-wrap: wrap;
                              gap: 0.25rem;
                              padding: 0.75rem;
                        }

                        .pagination button {
                              padding: 0.375rem 0.5rem;
                              font-size: 0.75rem;
                        }
                  }

                  @media (max-width: 480px) {
                        .header-content {
                              flex-direction: column;
                              gap: 1rem;
                              align-items: stretch;
                        }

                        .header-actions {
                              justify-content: center;
                        }

                        .table-info {
                              flex-direction: column;
                              align-items: center;
                        }

                        .table-container {
                              min-height: 120px;
                              max-height: none;
                        }

                        .table-content {
                              max-height: 30vh;
                        }

                        .data-table {
                              font-size: 0.7rem;
                              table-layout: auto;
                        }

                        .data-table th,
                        .data-table td {
                              padding: 0.5rem 0.25rem;
                              font-size: 0.7rem;
                              min-width: 60px;
                              max-width: 120px;
                        }

                        .data-table th {
                              font-size: 0.65rem;
                              letter-spacing: 0.01em;
                              text-transform: none;
                        }

                        .cell-content {
                              max-width: 120px;
                              font-size: 0.7rem;
                        }

                        .cell-json {
                              font-size: 0.65rem;
                              padding: 0.5rem;
                              max-height: 200px;
                        }

                        .cell-text-long .text-full {
                              max-width: 300px;
                              max-height: 300px;
                              font-size: 0.75rem;
                        }

                        .pagination {
                              flex-wrap: wrap;
                              gap: 0.25rem;
                              padding: 0.5rem;
                        }

                        .pagination button {
                              padding: 0.25rem 0.5rem;
                              font-size: 0.7rem;
                        }

                        .pagination-info {
                              font-size: 0.7rem;
                              margin: 0 0.5rem;
                        }
                  }

                  @media (max-width: 360px) {
                        .cell-content {
                              max-width: 100px;
                        }

                        .data-table th,
                        .data-table td {
                              padding: 0.25rem 0.125rem;
                              font-size: 0.65rem;
                              min-width: 50px;
                              max-width: 100px;
                        }

                        .data-table th {
                              font-size: 0.6rem;
                              padding: 0.5rem 0.125rem;
                        }

                        .table-toolbar {
                              padding: 0.75rem;
                        }

                        .info-item {
                              font-size: 0.75rem;
                        }
                  }

                  /* Landscape orientation for mobile */
                  @media (max-width: 768px) and (orientation: landscape) {
                        .table-container {
                              max-height: 70vh;
                        }

                        .data-table th,
                        .data-table td {
                              min-width: 100px;
                              max-width: 180px;
                        }

                        .data-table th {
                              font-size: 0.75rem;
                              letter-spacing: 0.03em;
                        }
                  }

                  /* Very wide screens */
                  @media (min-width: 1400px) {
                        .data-table th,
                        .data-table td {
                              min-width: 150px;
                              max-width: 250px;
                        }

                        .data-table th {
                              font-size: 0.8rem;
                              letter-spacing: 0.06em;
                        }
                  }

                  /* Animations */
                  .fade-in {
                        animation: fadeIn 0.3s ease-in;
                  }

                  @keyframes fadeIn {
                        from {
                              opacity: 0;
                              transform: translateY(10px);
                        }
                        to {
                              opacity: 1;
                              transform: translateY(0);
                        }
                  }

                  /* Scrollbar Styling */
                  ::-webkit-scrollbar {
                        width: 8px;
                        height: 8px;
                  }

                  ::-webkit-scrollbar-track {
                        background: var(--bg-secondary);
                  }

                  ::-webkit-scrollbar-thumb {
                        background: var(--border-color);
                        border-radius: 4px;
                  }

                  ::-webkit-scrollbar-thumb:hover {
                        background: var(--border-hover);
                  }

                  /* Table specific scrollbar */
                  .table-content::-webkit-scrollbar {
                        width: 6px;
                        height: 6px;
                  }

                  .table-content::-webkit-scrollbar-track {
                        background: var(--bg-secondary);
                  }

                  .table-content::-webkit-scrollbar-thumb {
                        background: var(--border-color);
                        border-radius: 3px;
                  }

                  .table-content::-webkit-scrollbar-thumb:hover {
                        background: var(--border-hover);
                  }

                  .deleted-item {
                        background: #ffeaea;
                        color: #b91c1c;
                        border: 1px solid #fca5a5;
                  }
                  .deleted-badge {
                        background: #ef4444;
                        color: white;
                        padding: 0.15rem 0.5rem;
                        border-radius: 0.375rem;
                        font-size: 0.7rem;
                        margin-left: 0.5rem;
                        font-weight: bold;
                        text-transform: uppercase;
                  }
                  .deleted-row {
                        background: #fff0f0;
                        color: #b91c1c;
                        text-decoration: line-through;
                  }

                  /* Database selection modal styles */
                  #databaseModal {
                        position: fixed;
                        top: 0;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        background: rgba(30, 41, 59, 0.7);
                        z-index: 9999;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                  }
                  #databaseModal .modal-content {
                        background: #fff;
                        border-radius: 0.75rem;
                        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
                        padding: 2.5rem 2rem 2rem 2rem;
                        min-width: 320px;
                        max-width: 90vw;
                        text-align: center;
                  }
                  #databaseModal h2 {
                        font-size: 1.3rem;
                        font-weight: 700;
                        margin-bottom: 1.5rem;
                        color: var(--primary-color);
                  }
                  #databaseModal select {
                        width: 100%;
                        padding: 0.75rem 1rem;
                        border-radius: var(--radius-md);
                        border: 1px solid var(--border-color);
                        font-size: 1rem;
                        margin-bottom: 1.5rem;
                  }
                  #databaseModal button {
                        padding: 0.5rem 1.5rem;
                        background: var(--primary-color);
                        color: #fff;
                        border: none;
                        border-radius: var(--radius-md);
                        font-size: 1rem;
                        font-weight: 600;
                        cursor: pointer;
                        transition: background 0.2s;
                  }
                  #databaseModal button:disabled {
                        background: var(--border-color);
                        color: #aaa;
                        cursor: not-allowed;
                  }

                  /* --- Overview Redesign --- */
                  .overview-wrapper {
                        padding: 2rem 1rem;
                        max-width: 1200px;
                        margin: 0 auto;
                        min-height: 100px;
                  }
                  .overview-header {
                        display: flex;
                        flex-wrap: wrap;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 2rem;
                        gap: 1rem;
                  }
                  .overview-title {
                        font-size: 2rem;
                        font-weight: 800;
                        color: var(--primary-color);
                        display: flex;
                        align-items: center;
                        gap: 0.75rem;
                  }
                  .overview-updated {
                        color: var(--text-secondary);
                        font-size: 1rem;
                        font-weight: 500;
                  }
                  .overview-dashboard {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 1.5rem;
                        margin-bottom: 2.5rem;
                        justify-content: flex-start;
                  }
                  .overview-card {
                        flex: 1 1 200px;
                        min-width: 200px;
                        max-width: 260px;
                        background: var(--bg-primary);
                        border-radius: var(--radius-lg);
                        box-shadow: var(--shadow-sm);
                        padding: 1.5rem 1.25rem;
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 0.5rem;
                        border: 1.5px solid var(--border-color);
                        transition:
                              box-shadow 0.2s,
                              transform 0.2s;
                  }
                  .overview-card:hover {
                        box-shadow: var(--shadow-md);
                        transform: translateY(-2px) scale(1.03);
                  }
                  .overview-card .card-icon {
                        font-size: 2rem;
                        margin-bottom: 0.5rem;
                  }
                  .overview-card.blue .card-icon {
                        color: var(--info-color);
                  }
                  .overview-card.green .card-icon {
                        color: var(--success-color);
                  }
                  .overview-card.orange .card-icon {
                        color: var(--warning-color);
                  }
                  .overview-card.purple .card-icon {
                        color: var(--primary-color);
                  }
                  .card-value {
                        font-size: 2.2rem;
                        font-weight: 900;
                        color: var(--text-primary);
                  }
                  .card-label {
                        font-size: 1rem;
                        color: var(--text-secondary);
                        font-weight: 600;
                  }
                  .overview-section {
                        margin-top: 2.5rem;
                  }
                  .section-title {
                        font-size: 1.15rem;
                        font-weight: 700;
                        color: var(--primary-color);
                        margin-bottom: 1rem;
                        display: flex;
                        align-items: center;
                        gap: 0.5rem;
                  }
                  .section-table-wrapper {
                        overflow-x: auto;
                        background: var(--bg-primary);
                        border-radius: var(--radius-md);
                        box-shadow: var(--shadow-sm);
                        border: 1px solid var(--border-color);
                  }
                  .overview-table {
                        width: 100%;
                        border-collapse: collapse;
                        font-size: 0.98rem;
                  }
                  .overview-table th,
                  .overview-table td {
                        padding: 0.85rem 1rem;
                        border-bottom: 1px solid var(--border-color);
                        text-align: left;
                        white-space: nowrap;
                  }
                  .overview-table th {
                        background: var(--bg-tertiary);
                        color: var(--text-primary);
                        font-weight: 700;
                        font-size: 0.95rem;
                  }
                  .overview-table tr:last-child td {
                        border-bottom: none;
                  }
                  .erd-graph-container {
                        width: 100%;
                        min-height: 420px;
                        background: var(--bg-tertiary);
                        border-radius: var(--radius-md);
                        box-shadow: var(--shadow-sm);
                        border: 1.5px solid var(--border-color);
                        margin-top: 1rem;
                        padding: 1rem 0.5rem;
                        position: relative;
                        overflow-x: auto;
                        display: block;
                  }
                  .erd-graph {
                        width: 100%;
                        min-width: 600px;
                        height: 60vh;
                        min-height: 400px;
                        max-height: 70vh;
                        background: #f8fafc;
                        border-radius: 0.5rem;
                        margin: 0 auto;
                        display: block;
                  }
                  @media (max-width: 900px) {
                        .overview-dashboard {
                              flex-direction: column;
                              gap: 1rem;
                        }
                        .overview-card {
                              max-width: 100%;
                              min-width: 0;
                              width: 100%;
                        }
                        .overview-header {
                              flex-direction: column;
                              align-items: flex-start;
                              gap: 0.5rem;
                        }
                        .erd-graph {
                              min-width: 350px;
                              height: 40vh;
                              min-height: 220px;
                        }
                  }
                  @media (max-width: 600px) {
                        .overview-wrapper {
                              padding: 1rem 0.25rem;
                        }
                        .overview-title {
                              font-size: 1.2rem;
                        }
                        .overview-card {
                              padding: 1rem 0.75rem;
                        }
                        .section-title {
                              font-size: 1rem;
                        }
                        .erd-graph {
                              min-width: 250px;
                              height: 30vh;
                              min-height: 120px;
                        }
                  }
                  /* --- End Overview Redesign --- */
            </style>
      </head>
      <body>
            <div class="header">
                  <div class="header-content">
                        <div class="header-left">
                              <div class="header-title">
                                    <i class="fas fa-database"></i>
                                    Database Admin Panel
                                    <span class="header-badge">Read Only</span>
                              </div>
                        </div>
                        <div class="header-actions">
                              <button class="btn btn-secondary btn-sm" onclick="adminPanel.refreshAll()">
                                    <i class="fas fa-sync-alt"></i>
                                    Refresh
                              </button>
                              <button class="btn btn-primary btn-sm" onclick="adminPanel.showOverview()">
                                    <i class="fas fa-chart-bar"></i>
                                    Overview
                              </button>
                        </div>
                  </div>
            </div>

            <div class="main-container">
                  <div class="sidebar">
                        <div class="sidebar-header">
                              <div class="search-container">
                                    <i class="fas fa-search search-icon"></i>
                                    <input type="text" id="tableSearch" class="search-input" placeholder="Search tables..." />
                              </div>
                        </div>
                        <div class="sidebar-content">
                              <ul class="table-list" id="tableList">
                                    <li class="loading-container">
                                          <div class="loading-spinner"></div>
                                          <div>Loading tables...</div>
                                    </li>
                              </ul>
                        </div>
                  </div>

                  <div class="main-content">
                        <div id="content">
                              <div class="loading-container">
                                    <i class="fas fa-table" style="font-size: 3rem; opacity: 0.5; margin-bottom: 1rem"></i>
                                    <div>Select a table to view data</div>
                              </div>
                        </div>
                  </div>
            </div>

            <div id="databaseModal" style="display: none">
                  <div class="modal-content">
                        <h2>انتخاب دیتابیس</h2>
                        <select id="modalDatabaseSelect">
                              <option value="">در حال بارگذاری...</option>
                        </select>
                        <button id="selectDatabaseBtn" disabled>تایید</button>
                  </div>
            </div>

            <div id="erdModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10000; background: rgba(30, 41, 59, 0.7); align-items: center; justify-content: center">
                  <div style="background: #fff; border-radius: 0.75rem; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); padding: 2rem; min-width: 320px; max-width: 95vw; max-height: 90vh; overflow: auto; position: relative">
                        <button onclick="adminPanel.hideErdModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer">&times;</button>
                        <h2 style="margin-bottom: 1rem; font-size: 1.2rem; color: #6366f1">نمودار ارتباط جداول (ERD)</h2>
                        <div id="erdGraph" style="width: 80vw; max-width: 1200px; height: 70vh; min-height: 400px; background: #f8fafc; border-radius: 0.5rem"></div>
                        <div id="erdLoading" style="display: none; text-align: center; padding: 1rem; color: #64748b">
                              <div class="loading-spinner" style="margin: 2rem auto"></div>
                              در حال بارگذاری نمودار...
                        </div>
                        <div id="erdError" style="display: none; text-align: center; padding: 1rem; color: #ef4444"></div>
                  </div>
            </div>

            <div id="toastContainer" style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 99999"></div>

            <script src="./cytoscape.min.js"></script>
            <script>
                  class DatabaseAdminPanel {
                        constructor() {
                              this.currentDatabase = null;
                              this.currentTable = null;
                              this.currentPage = 1;
                              this.pageSize = 50;
                              this.tables = [];
                              this.overview = null;
                              this.databases = [];
                              this.init();
                        }

                        async init() {
                              await this.loadDatabases();
                              this.setupEventListeners();
                              this.showDatabaseModal();
                        }

                        async loadDatabases() {
                              try {
                                    const response = await fetch('http://localhost:7002/databases');
                                    if (response.ok) {
                                          const data = await response.json();
                                          if (data.status === 'success') {
                                                this.databases = data.data;
                                                this.populateDatabaseModal();
                                          }
                                    }
                              } catch (error) {
                                    console.error('Failed to load databases:', error);
                              }
                        }

                        showDatabaseModal() {
                              const modal = document.getElementById('databaseModal');
                              modal.style.display = 'flex';
                              this.populateDatabaseModal();
                              // Block rest of UI
                              document.body.style.overflow = 'hidden';
                              // Handle select change
                              const select = document.getElementById('modalDatabaseSelect');
                              const btn = document.getElementById('selectDatabaseBtn');
                              select.addEventListener('change', () => {
                                    btn.disabled = !select.value;
                              });
                              btn.addEventListener('click', () => {
                                    if (select.value) {
                                          this.currentDatabase = select.value;
                                          modal.style.display = 'none';
                                          document.body.style.overflow = '';
                                          this.refreshAll();
                                    }
                              });
                        }

                        populateDatabaseModal() {
                              const select = document.getElementById('modalDatabaseSelect');
                              if (!select) return;
                              if (!this.databases.length) {
                                    select.innerHTML = '<option value="">دیتابیسی یافت نشد</option>';
                                    select.disabled = true;
                                    document.getElementById('selectDatabaseBtn').disabled = true;
                                    return;
                              }
                              select.innerHTML = '<option value="">یک دیتابیس را انتخاب کنید...</option>' + this.databases.map(db => `<option value="${db}">${db}</option>`).join('');
                              select.disabled = false;
                              document.getElementById('selectDatabaseBtn').disabled = true;
                        }

                        setupEventListeners() {
                              document.getElementById('tableSearch').addEventListener('input', e => {
                                    this.filterTables(e.target.value);
                              });
                              setInterval(() => {
                                    if (this.currentTable) {
                                          this.fetchTableData();
                                    }
                              }, 30000);
                        }

                        async loadOverview() {
                              if (!this.currentDatabase) return;
                              try {
                                    const response = await fetch(`http://localhost:7002/overview?database=${encodeURIComponent(this.currentDatabase)}`);
                                    if (response.ok) {
                                          const data = await response.json();
                                          if (data.status === 'success') {
                                                this.overview = data.data;
                                          }
                                    }
                              } catch (error) {
                                    console.error('Failed to load overview:', error);
                              }
                        }

                        async loadTables() {
                              if (!this.currentDatabase) return;
                              try {
                                    const response = await fetch(`http://localhost:7002/tables?database=${encodeURIComponent(this.currentDatabase)}`, { cache: 'no-store' });
                                    if (!response.ok) {
                                          throw new Error(`HTTP error! status: ${response.status}`);
                                    }
                                    const data = await response.json();
                                    if (data.status === 'success') {
                                          if (Array.isArray(data.data)) {
                                                this.tables = data.data;
                                          } else if (data.data && typeof data.data === 'object' && data.data !== null) {
                                                this.tables = Object.values(data.data);
                                          } else {
                                                this.tables = [];
                                          }
                                          this.renderTableList();
                                    } else {
                                          throw new Error(data.message || 'Unknown error');
                                    }
                              } catch (error) {
                                    console.error('Error loading tables:', error);
                                    this.tables = [];
                                    this.showError('Failed to load tables: ' + error.message);
                                    this.renderTableList();
                              }
                        }

                        renderTableList() {
                              const tableList = document.getElementById('tableList');
                              tableList.innerHTML = '';

                              // Defensive: ensure this.tables is always an array
                              const tables = Array.isArray(this.tables) ? this.tables : [];
                              tables.forEach(table => {
                                    const li = document.createElement('li');
                                    li.className = 'table-item';
                                    // If table has is_deleted or deleted_at, add a deleted class
                                    if (table.is_deleted || table.deleted_at) {
                                          li.classList.add('deleted-item');
                                    }
                                    li.innerHTML = `
                        <div class="table-name">
                            <i class="fas fa-table table-icon"></i>
                            ${table.name}
                            ${table.is_deleted || table.deleted_at ? '<span class="deleted-badge">Deleted</span>' : ''}
                        </div>
                        <div class="table-size">
                            <i class="fas fa-hdd"></i>
                            ${table.size || '0 kB'}
                            <span class="table-count" style="color: var(--text-muted); font-size: 0.85em; margin-left: 8px; vertical-align: middle;">
                                <i class="fas fa-list" style="opacity:0.7;"></i>
                                ${table.actual_rows?.toLocaleString() || table.estimated_rows?.toLocaleString() || '0'} rows
                            </span>
                        </div>
                    `;
                                    li.addEventListener('click', () => this.loadTableData(table.name));
                                    tableList.appendChild(li);
                              });
                        }

                        filterTables(searchTerm) {
                              const tableItems = document.querySelectorAll('.table-item');
                              tableItems.forEach(item => {
                                    const tableName = item.querySelector('.table-name').textContent.toLowerCase();
                                    if (tableName.includes(searchTerm.toLowerCase())) {
                                          item.style.display = 'block';
                                          // Highlight
                                          item.querySelector('.table-name').innerHTML = tableName.replace(new RegExp(searchTerm, 'gi'), match => `<mark style="background:#fde68a;color:#92400e;">${match}</mark>`);
                                    } else {
                                          item.style.display = 'none';
                                    }
                              });
                        }

                        async loadTableData(tableName) {
                              this.currentTable = tableName;
                              this.currentPage = 1;
                              document.querySelectorAll('.table-item').forEach(item => {
                                    item.classList.remove('active');
                              });
                              event.target.closest('.table-item').classList.add('active');
                              this.showLoading();
                              await this.fetchTableData();
                        }

                        async fetchTableData() {
                              if (!this.currentDatabase || !this.currentTable) return;
                              const tableRefreshBtn = document.querySelector('.table-actions .btn-secondary i.fa-sync-alt');
                              if (tableRefreshBtn) {
                                    tableRefreshBtn.classList.add('fa-spin');
                              }
                              try {
                                    const response = await fetch(`http://localhost:7002/tables/${this.currentTable}?database=${encodeURIComponent(this.currentDatabase)}&page=${this.currentPage}&limit=${this.pageSize}`);
                                    const data = await response.json();
                                    if (data.status === 'success') {
                                          this.renderTableData(data.data);
                                    } else {
                                          throw new Error(data.message);
                                    }
                              } catch (error) {
                                    this.showError('Failed to load table data: ' + error.message);
                              } finally {
                                    if (tableRefreshBtn) {
                                          tableRefreshBtn.classList.remove('fa-spin');
                                    }
                              }
                        }

                        renderTableData(data) {
                              const content = document.getElementById('content');

                              if (!data.rows || data.rows.length === 0) {
                                    content.innerHTML = `
                        <div class="content-header">
                            <div class="content-title">${this.currentTable}</div>
                            <div class="content-subtitle">No data available</div>
                        </div>
                        <div class="content-body">
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <div>This table is empty</div>
                            </div>
                        </div>
                    `;
                                    return;
                              }

                              const columns = Object.keys(data.rows[0] || {});
                              const rows = data.rows;
                              const totalRows = data.table_info?.total_rows || rows.length;

                              let tableHTML = `
                    <div class="content-header">
                        <div class="content-title">${this.currentTable}</div>
                        <div class="content-subtitle">Database table with ${totalRows.toLocaleString()} total rows</div>
                    </div>
                    <div class="content-body">
                        <div class="table-container">
                            <div class="table-toolbar">
                                <div class="table-info">
                                    <div class="info-item">
                                        <i class="fas fa-list"></i>
                                        ${totalRows.toLocaleString()} total rows
                                    </div>
                                    <div class="info-item">
                                        <i class="fas fa-columns"></i>
                                        ${columns.length} columns
                                    </div>
                                    <div class="info-item">
                                        <i class="fas fa-file-alt"></i>
                                        Page ${this.currentPage} of ${Math.ceil(totalRows / this.pageSize)}
                                    </div>
                                </div>
                                <div class="table-actions">
                                    <button class="btn btn-secondary btn-sm" onclick="adminPanel.fetchTableData()">
                                        <i class="fas fa-sync-alt"></i>
                                        Refresh
                                    </button>
                                    <button class="btn btn-primary btn-sm" onclick="adminPanel.showTableStructure()">
                                        <i class="fas fa-cog"></i>
                                        Structure
                                    </button>
                                    <button class="btn btn-secondary btn-sm" onclick="adminPanel.exportTable('csv')">
                                        <i class="fas fa-file-csv"></i>
                                        Export CSV
                                    </button>
                                    <button class="btn btn-secondary btn-sm" onclick="adminPanel.exportTable('json')">
                                        <i class="fas fa-file-code"></i>
                                        Export JSON
                                    </button>
                                    <button class="btn btn-primary btn-sm" onclick="adminPanel.showTableRelationships()">
                                        <i class="fas fa-project-diagram"></i>
                                        روابط
                                    </button>
                                    <button class="btn btn-primary btn-sm" onclick="adminPanel.showRecentActivity()">
                                        <i class="fas fa-history"></i>
                                        فعالیت‌های اخیر
                                    </button>
                                </div>
                            </div>
                            <div class="table-content">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            ${columns.map(col => `<th>${col}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>
                `;

                              rows.forEach(row => {
                                    // Highlight deleted rows
                                    const isDeleted = row.is_deleted || row.deleted_at;
                                    tableHTML += `<tr${isDeleted ? ' class="deleted-row"' : ''}>`;
                                    columns.forEach(col => {
                                          const value = row[col];
                                          tableHTML += `<td><div class="cell-content">${this.formatCellValue(value)}</div></td>`;
                                    });
                                    tableHTML += '</tr>';
                              });

                              tableHTML += `
                                    </tbody>
                                </table>
                            </div>
                `;

                              // Add pagination if needed
                              if (totalRows > this.pageSize) {
                                    tableHTML += this.renderPagination(totalRows);
                              }

                              tableHTML += '</div></div>';
                              content.innerHTML = tableHTML;
                        }

                        formatCellValue(value) {
                              if (value === null || value === undefined) {
                                    return '<span class="cell-null">null</span>';
                              }

                              if (typeof value === 'boolean') {
                                    return `<span class="cell-boolean ${value}">${value ? '✓' : '✗'} ${value}</span>`;
                              }

                              if (typeof value === 'number') {
                                    return `<span class="cell-number">${value.toLocaleString()}</span>`;
                              }

                              if (typeof value === 'object') {
                                    return `<div class="cell-json">${JSON.stringify(value, null, 2)}</div>`;
                              }

                              if (typeof value === 'string') {
                                    // Check if it's a URL
                                    if (value.match(/^https?:\/\//)) {
                                          return `<a href="${value}" target="_blank" class="cell-url">${value}</a>`;
                                    }

                                    // Check if it's a date
                                    if (value.match(/^\d{4}-\d{2}-\d{2}/) || value.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                                          return `<span class="cell-date">${value}</span>`;
                                    }

                                    // Check if it's a long text
                                    if (value.length > 100) {
                                          return `
                            <div class="cell-text-long">
                                <div class="text-preview">${value}</div>
                                <div class="text-full">${value}</div>
                            </div>
                        `;
                                    }

                                    return value;
                              }

                              return String(value);
                        }

                        renderPagination(totalRows) {
                              const totalPages = Math.ceil(totalRows / this.pageSize);
                              const currentPage = this.currentPage;

                              return `
                    <div class="pagination">
                        <button onclick="adminPanel.goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>
                            <i class="fas fa-angle-double-left"></i>
                        </button>
                        <button onclick="adminPanel.goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                            <i class="fas fa-angle-left"></i>
                        </button>
                        <div class="pagination-info">
                            Page ${currentPage} of ${totalPages}
                        </div>
                        <button onclick="adminPanel.goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                            <i class="fas fa-angle-right"></i>
                        </button>
                        <button onclick="adminPanel.goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>
                            <i class="fas fa-angle-double-right"></i>
                        </button>
                    </div>
                `;
